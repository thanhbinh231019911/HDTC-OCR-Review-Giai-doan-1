<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --line: #d9dee7;
      --text: #17202a;
      --muted: #637083;
      --accent: #1769aa;
      --danger: #b3261e;
      --warn: #8a5a00;
      --ok: #146c43;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 18px; font-weight: 700; }
    main { max-width: 1320px; margin: 0 auto; padding: 16px 20px 32px; }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    nav button, .action {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      min-height: 36px;
    }
    nav button.active, .primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .danger { color: var(--danger); }
    .section { display: none; }
    .section.active { display: block; }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
    }
    .metric span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--line);
      table-layout: fixed;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px;
      vertical-align: top;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    th {
      text-align: left;
      background: #eef2f6;
      color: #263241;
      font-size: 12px;
    }
    td small { color: var(--muted); display: block; margin-top: 4px; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .issues {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .issue-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      min-height: 80px;
    }
    .issue-box h2 { font-size: 15px; margin: 0 0 8px; }
    .issue-box ul { margin: 0; padding-left: 18px; }
    dialog {
      border: 1px solid var(--line);
      border-radius: 8px;
      width: min(720px, calc(100vw - 32px));
      padding: 0;
    }
    dialog form { padding: 16px; }
    textarea, input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      font: inherit;
    }
    textarea { min-height: 120px; resize: vertical; }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }
    .loading { padding: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
    .review-split {
      display: grid;
      grid-template-columns: minmax(280px, 38%) minmax(0, 62%);
      gap: 12px;
      align-items: start;
      max-width: 100%;
      overflow: hidden;
    }
    .source-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      position: sticky;
      top: 82px;
      overflow: hidden;
      min-width: 0;
      max-width: 100%;
    }
    .source-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .source-tabs button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 6px;
      padding: 6px 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .source-tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .image-stage {
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f4f8;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: auto;
      padding: 8px;
      text-align: center;
    }
    .image-stage img { display: block; max-width: 100%; height: auto; }
    .data-panel { min-width: 0; }
    .entity-review { margin-bottom: 16px; }
    .entity-review h2 { margin: 0 0 8px; font-size: 16px; }
    .image-list { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .source-image-card {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      padding: 8px;
      overflow: hidden;
      min-width: 0;
    }
    .source-image-title {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      overflow-wrap: anywhere;
    }
    .source-image-frame {
      height: 520px;
      max-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f4f8;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      min-width: 0;
      width: 100%;
    }
    .source-image-tools { display: flex; gap: 6px; margin-bottom: 6px; }
    .source-image-tools button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
    .source-image-frame img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; transform-origin: center center; transition: transform .12s ease; }
    .source-image-frame img.rotate-90 { transform: rotate(90deg) scale(.78); }
    .source-image-frame img.rotate-180 { transform: rotate(180deg); }
    .source-image-frame img.rotate-270 { transform: rotate(270deg) scale(.78); }


    @media (max-width: 760px) {
      header { align-items: flex-start; flex-direction: column; }
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tr { border-bottom: 2px solid var(--line); }
      td { border-bottom: 1px solid #edf0f4; }
      .review-split { grid-template-columns: 1fr; }
      .source-panel { position: static; }
      td::before {
        content: attr(data-label);
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 2px;
      }
    }
  
    .asset-doc { border: 1px solid var(--line); background: #fff; border-radius: 6px; overflow: hidden; }
    .asset-doc-section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .asset-doc-section:last-child { border-bottom: 0; }
    .asset-doc-section h3 { margin: 0 0 10px; font-size: 15px; }
    .asset-doc-grid { display: grid; grid-template-columns: 190px 1fr; gap: 8px 12px; }
    .asset-doc-label { color: var(--muted); }
    .asset-doc-value { font-weight: 600; white-space: pre-wrap; }
    .asset-doc-lines { line-height: 1.55; white-space: pre-wrap; }
    .asset-doc-line { margin: 2px 0; }
    .asset-doc-edit { margin-top: 12px; }
    .contract-generation { max-width: 1200px; margin: 16px auto 40px; }
    .contract-panel { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
    .contract-panel h2 { margin: 0 0 10px; font-size: 16px; }
    .draft-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 12px; margin: 12px 0; }
    .draft-section { margin: 12px 0 14px; }
    .draft-section h4 { margin: 0 0 8px; font-size: 13px; }
    .draft-grid.compact { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .draft-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .draft-field input, .draft-field select, .draft-field textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit; background: #fff; }
    .draft-field input:disabled, .draft-field select:disabled { background: #f1f5f9; color: #475569; }
    .draft-field textarea { min-height: 68px; resize: vertical; }
    .draft-actions { display: flex; align-items: center; gap: 10px; margin: 8px 0 14px; }
    .draft-status { color: var(--muted); font-size: 13px; }
    .template-category { margin: 14px 0 16px; }
    .template-category h3 { margin: 0 0 8px; font-size: 14px; }
    .template-list { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 10px 0; }
    .template-item { border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; }
    .template-item input[type="checkbox"] { width: 16px !important; height: 16px !important; min-width: 16px; max-width: 16px; margin: 2px 0 0; padding: 0; flex: 0 0 16px; }
    .template-item span { display: block; min-width: 0; overflow-wrap: anywhere; }
    .template-item.disabled { color: var(--muted); background: #f8fafc; }
    .template-item small { display: block; color: var(--muted); margin-top: 4px; }
    .generated-result { margin-top: 10px; }
    .generated-item { border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin-top: 8px; background: #fff; }
    .generated-item strong { display: block; margin-bottom: 6px; }
    .generated-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .download-link { display: inline-block; padding: 8px 10px; border-radius: 6px; background: var(--primary); color: #fff; text-decoration: none; }
    @media (max-width: 760px) { .asset-doc-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Review h&#7891; s&#417; OCR</h1>
      <div id="caseLine"></div>
    </div>
    <div class="toolbar">
      <button class="action" onclick="reloadData()">T&#7843;i l&#7841;i</button>
      <button id="confirmReviewButton" class="action primary" onclick="confirmReview(false)">X&#225;c nh&#7853;n d&#7919; li&#7879;u</button>
    </div>
  </header>
  <main>
    <div id="loading" class="loading">&#272;ang t&#7843;i d&#7919; li&#7879;u...</div>
    <div id="app" style="display:none">
      <div class="summary">
        <div class="metric"><span>Tr&#7841;ng th&#225;i validation</span><strong id="validationStatus"></strong></div>
        <div class="metric"><span>Tr&#432;&#7901;ng thi&#7871;u</span><strong id="missingCount"></strong></div>
        <div class="metric"><span>M&#226;u thu&#7851;n</span><strong id="conflictCount"></strong></div>
        <div class="metric"><span>C&#7843;nh b&#225;o</span><strong id="warningCount"></strong></div>
      </div>
      <nav id="tabs"></nav>
      <section id="issues" class="issues"></section>
      <section id="content"></section>
      <section id="contractGeneration" class="contract-generation"></section>
    </div>
  </main>

  <dialog id="editDialog">
    <form method="dialog">
      <h2 id="editTitle">S&#7917;a d&#7919; li&#7879;u</h2>
      <label>Gi&#225; tr&#7883; m&#7899;i</label>
      <textarea id="editValue"></textarea>
      <label>L&#253; do ch&#7881;nh s&#7917;a</label>
      <input id="editReason" placeholder="Kh&#244;ng b&#7855;t bu&#7897;c">
      <div class="modal-actions">
        <button class="action" value="cancel">H&#7911;y</button>
        <button class="action primary" type="button" onclick="saveEdit()">L&#432;u</button>
      </div>
    </form>
  </dialog>

  <dialog id="ocrDialog">
    <form method="dialog">
      <h2 id="ocrTitle">OCR text</h2>
      <textarea id="ocrText" readonly></textarea>
      <div class="modal-actions">
        <button class="action" value="cancel">&#272;&#243;ng</button>
      </div>
    </form>
  </dialog>

  <script>
    const CASE_ID = '<?= caseId ?>';
    const TOKEN = '<?= token ?>';
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    let reviewData = null;
    let currentEditPath = '';
    let imageCache = {};
    let confirmBusy = false;
    let generateBusy = false;
    let autoOcrBusy = false;
    let autoRegistryOcrBusy = false;
    let autoIssueDateOcrBusy = false;
    let autoA4OcrBusy = false;
    let autoOcrDonePaths = {};
    let autoA4OcrDebug = [];

    function vi(key) {
      const map = {
        missing: '\u0054\u0072\u01b0\u1edd\u006e\u0067 \u0074\u0068\u0069\u1ebf\u0075',
        conflicts: '\u004d\u00e2\u0075 \u0074\u0068\u0075\u1eab\u006e',
        warnings: '\u0043\u1ea3\u006e\u0068 \u0062\u00e1\u006f',
        none: '\u004b\u0068\u00f4\u006e\u0067 \u0063\u00f3',
        contractTab: '\u0054\u0068\u00f4\u006e\u0067 \u0074\u0069\u006e \u0068\u1ee3\u0070 \u0111\u1ed3\u006e\u0067',
        securedTab: '\u0042\u00ea\u006e \u0062\u1ea3\u006f \u0111\u1ea3\u006d',
        obligorTab: '\u0042\u00ea\u006e \u0111\u01b0\u1ee3\u0063 \u0062\u1ea3\u006f \u0111\u1ea3\u006d',
        assetTab: '\u0054\u00e0\u0069 \u0073\u1ea3\u006e',
        lowConfidence: '\u004f\u0043\u0052/AI \u0063\u00f3 \u0111\u1ed9 \u0074\u0069\u006e \u0063\u1ead\u0079 \u0074\u0068\u1ea5\u0070, \u0063\u1ea7\u006e \u006b\u0069\u1ec3\u006d \u0074\u0072\u0061 \u0074\u0068\u1ee7 \u0063\u00f4\u006e\u0067',
        fieldsToCheck: '\u0043\u00e1\u0063 \u0074\u0072\u01b0\u1edd\u006e\u0067 \u0063\u1ea7\u006e \u006b\u0069\u1ec3\u006d \u0074\u0072\u0061',
        field: '\u0054\u0072\u01b0\u1edd\u006e\u0067',
        manual: '\u0053\u1eeda \u0074\u0068\u1ee7 \u0063\u00f4\u006e\u0067',
        final: '\u0043\u0075\u1ed1\u0069 \u0063\u00f9\u006e\u0067',
        source: '\u004e\u0067\u0075\u1ed3\u006e',
        action: '\u0054\u0068\u0061\u006f \u0074\u00e1\u0063',
        edit: '\u0053\u1eeda \u0111\u1ed5\u0069',
        confirm: '\u0058\u00e1\u0063 \u006e\u0068\u1ead\u006e'
      };
      return map[key] || key;
    }

    async function api(action, payload) {
      const body = Object.assign({ action, caseId: CASE_ID, token: TOKEN }, payload || {});
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(result => {
            if (!result) {
              reject(new Error('API kh\u00f4ng tr\u1ea3 v\u1ec1 d\u1eef li\u1ec7u. H\u00e3y t\u1ea3i l\u1ea1i trang ho\u1eb7c ch\u1ea1y l\u1ea1i review case.'));
              return;
            }
            resolve(result);
          })
          .withFailureHandler(err => reject(new Error(err && err.message ? err.message : String(err))))
          .reviewApi(body);
      });
    }

    async function reloadData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('app').style.display = 'none';
      try {
        reviewData = await api('getReview');
        render();
      } catch (err) {
        document.getElementById('loading').textContent = err.message;
      }
    }

    function render() {
      if (!reviewData || !reviewData.case_id) {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('app').style.display = 'none';
        document.getElementById('loading').textContent = 'Kh\u00f4ng t\u1ea3i \u0111\u01b0\u1ee3c d\u1eef li\u1ec7u review. Case: ' + CASE_ID;
        return;
      }
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('caseLine').textContent = reviewData.case_id || CASE_ID;
      document.getElementById('validationStatus').textContent = reviewData.validation.status;
      document.getElementById('missingCount').textContent = reviewData.validation.missing_fields.length;
      document.getElementById('conflictCount').textContent = reviewData.validation.conflicts.length;
      document.getElementById('warningCount').textContent = reviewData.validation.warnings.length;
      if (isReviewConfirmed()) {
        showContractPage();
        return;
      }
      showReviewPage();
    }

    function isReviewConfirmed() {
      return String(reviewData && reviewData.review && reviewData.review.status || '').indexOf('REVIEW_CONFIRMED') >= 0;
    }

    function showReviewPage() {
      document.querySelector('.summary').style.display = '';
      document.getElementById('tabs').style.display = '';
      document.getElementById('issues').style.display = '';
      document.getElementById('content').style.display = '';
      document.getElementById('contractGeneration').innerHTML = '';
      renderIssues();
      renderTabs();
      showTab('secured');
      setConfirmBusy(false);
    }

    function showContractPage() {
      document.querySelector('.summary').style.display = 'none';
      document.getElementById('tabs').style.display = 'none';
      document.getElementById('issues').style.display = 'none';
      document.getElementById('content').style.display = 'none';
      setConfirmBusy(false);
      renderContractGeneration(true);
      setTimeout(function() { window.scrollTo({ top: 0, behavior: 'smooth' }); }, 50);
    }

    function setConfirmBusy(busy) {
      confirmBusy = busy;
      const btn = document.getElementById('confirmReviewButton');
      if (!btn) return;
      btn.disabled = busy || isReviewConfirmed();
      btn.textContent = busy ? 'Dang xac nhan...' : (isReviewConfirmed() ? 'Da xac nhan du lieu' : 'Xac nhan du lieu');
    }

    function renderIssues() {
      const el = document.getElementById('issues');
      el.innerHTML = [
        issueBox(vi('missing'), reviewData.validation.missing_fields),
        issueBox(vi('conflicts'), reviewData.validation.conflicts),
        warningIssueBox(vi('warnings'), reviewData.validation.warnings)
      ].join('');
    }

    function issueBox(title, items) {
      const list = (items || []).map(i => '<li><strong>' + escapeHtml(issueTitle(i)) + '</strong>: ' + escapeHtml(issueMessage(i)) + '</li>').join('');
      return '<div class="issue-box"><h2>' + title + '</h2>' + (list ? '<ul>' + list + '</ul>' : '<div>' + vi('none') + '</div>') + '</div>';
    }

    function warningIssueBox(title, items) {
      const groups = groupWarnings(items || []);
      if (!groups.length) return '<div class="issue-box"><h2>' + title + '</h2><div>' + vi('none') + '</div></div>';
      const html = groups.map(group => {
        const children = group.items.map(item => '<li>' + escapeHtml(issueTitle(item)) + '</li>').join('');
        return '<li><strong>' + escapeHtml(group.title) + '</strong>' + (children ? '<div class="issue-subtitle">' + vi('fieldsToCheck') + ':</div><ul>' + children + '</ul>' : '') + '</li>';
      }).join('');
      return '<div class="issue-box"><h2>' + title + '</h2><ul>' + html + '</ul></div>';
    }

    function groupWarnings(items) {
      const buckets = {};
      (items || []).forEach(item => {
        const msg = issueMessage(item);
        const key = normalizeWarningMessage(msg);
        buckets[key] = buckets[key] || { title: key, items: [] };
        buckets[key].items.push(item);
      });
      return Object.keys(buckets).map(key => buckets[key]);
    }

    function normalizeWarningMessage(message) {
      const plain = removeVietnameseMarks(message).toLowerCase();
      if (plain.indexOf('ocr/ai') >= 0) return vi('lowConfidence');
      return humanizeIssueText(message);
    }

    function issueTitle(issue) {
      const path = issue && issue.field_path ? issue.field_path : '';
      const label = issue && issue.label ? issue.label : '';
      if (path) return humanFieldPath(path);
      if (label && !looksCorruptedText(label) && !looksLikeJsonPath(label)) return label;
      return humanFieldPath(label || '');
    }

    function issueMessage(issue) {
      const msg = issue && issue.message ? issue.message : (issue && issue.severity ? issue.severity : '');
      return humanizeIssueText(msg);
    }

    function looksLikeJsonPath(value) {
      return /^(contract_info|secured_parties|obligors|assets)\b/.test(String(value || ''));
    }

    function humanizeIssueText(value) {
      let text = String(value || '');
      const paths = text.match(/\b(?:contract_info|secured_parties|obligors|assets)(?:\[\d+\])?(?:\.[a-zA-Z0-9_]+)*/g) || [];
      paths.forEach(path => { text = text.replaceAll(path, humanFieldPath(path)); });
      return text;
    }

    function humanFieldPath(path) {
      path = String(path || '');
      const indexMatch = path.match(/\[(\d+)\]/);
      const number = indexMatch ? Number(indexMatch[1]) + 1 : '';
      const normalized = path.replace(/\[\d+\]/g, '[]');
      const labels = {
        'contract_info.contract_type': 'Loai hop dong ' + number,
        'contract_info.asset_type': 'Loai tai san ' + number,
        'contract_info.valuation_amount': 'Gia tri dinh gia ' + number,
        'contract_info.bank_signer': 'Nguoi ky tai ngan hang ' + number,
        'contract_info.dispute_court': 'Toa an xu ly tranh chap ' + number,
        'secured_parties[].full_name': 'Ho ten ben bao dam ' + number,
        'secured_parties[].date_of_birth': 'Ngay sinh ben bao dam ' + number,
        'secured_parties[].id_document_type': 'Loai giay to tuy than ben bao dam ' + number,
        'secured_parties[].id_number': 'So giay to tuy than ben bao dam ' + number,
        'secured_parties[].id_issue_date': 'Ngay cap giay to tuy than ben bao dam ' + number,
        'secured_parties[].id_issue_place': 'Noi cap giay to tuy than ben bao dam ' + number,
        'secured_parties[].permanent_address': 'Dia chi thuong tru ben bao dam ' + number,
        'secured_parties[].gender': 'Gioi tinh ben bao dam ' + number,
        'secured_parties[].nationality': 'Quoc tich ben bao dam ' + number,

    function renderTabs() {
      const tabs = [
        ['secured', vi('securedTab')],
        ['obligors', vi('obligorTab')],
        ['assets', vi('assetTab')],
        ['ocr', 'OCR']
      ];
      document.getElementById('tabs').innerHTML = tabs.map(t => `<button id="tab-${t[0]}" onclick="showTab('${t[0]}')">${t[1]}</button>`).join('');
    }

    function showTab(tab) {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      if (tab === 'secured') renderPeople('content', reviewData.secured_parties || [], 'secured_parties', 'secured_party');
      if (tab === 'obligors') renderPeople('content', reviewData.obligors || [], 'obligors', 'obligor');
      if (tab === 'assets') renderAssets('content', 'asset');
      if (tab === 'ocr') renderOcr('content');
    }

    function renderPeople(targetId, people, root, group) {
      const entries = sortPeopleEntriesForDisplay(people || [], group);
      const html = entries.map((entry, i) => {
        const p = entry.person;
        const dataIndex = entry.index;
        const title = escapeHtml((p.full_name && p.full_name.final_value) || 'Nguoi ' + (i + 1));
        const files = getFilesForObject(p, group);
        return '<div class="entity-review"><h2>' + title + '</h2>' + compareLayoutHtml(group + '-person-' + dataIndex, files, fieldTable(sortPersonFields(flattenFields(p, root + '[' + dataIndex + ']')))) + '</div>';
      }).join('');
      document.getElementById(targetId).innerHTML = html || '<div class="loading">Khong co du lieu.</div>';
      hydrateAllSourceImages();
    }

    function sortPeopleEntriesForDisplay(people, group) {
      const entries = (people || []).map((person, index) => ({ person, index }));
      if (group !== 'secured_party') return entries;
      const order = getAssetOwnerNameOrder();
      if (!order.length) return entries;
      return entries.slice().sort((a, b) => ownerOrderIndex(a.person, order) - ownerOrderIndex(b.person, order));
    }

    function sortPeopleForDisplay(people, group) {
      if (group !== 'secured_party') return people || [];
      const order = getAssetOwnerNameOrder();
      if (!order.length) return people || [];
      return (people || []).slice().sort((a, b) => ownerOrderIndex(a, order) - ownerOrderIndex(b, order));
    }

    function getAssetOwnerNameOrder() {
      const first = (reviewData.assets || [])[0] || {};
      const summary = valueOf(first.owner_identity_summary) || valueOf(first.owner_name);
      return summary.split(';').map(part => normalizeNameForDisplay(part.split('-')[0].split(',')[0])).filter(Boolean);
    }

    function ownerOrderIndex(person, order) {
      const name = normalizeNameForDisplay(person && person.full_name && person.full_name.final_value);
      const idx = order.findIndex(item => item && name && (item.indexOf(name) >= 0 || name.indexOf(item) >= 0));
      return idx >= 0 ? idx : 999;
    }

    function normalizeNameForDisplay(value) {
      return removeVietnameseMarks(value).toUpperCase().replace(/[^A-Z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function sortPersonFields(fields) {
      const priority = ['full_name', 'date_of_birth', 'id_document_type', 'id_number', 'id_issue_date', 'id_issue_place', 'permanent_address'];
      return (fields || []).slice().sort((a, b) => fieldPriority(a.path, priority) - fieldPriority(b.path, priority));
    }

    function fieldPriority(path, priority) {
      const key = String(path || '').split('.').pop();
      const idx = priority.indexOf(key);
      return idx >= 0 ? idx : 100;
    }

    function renderAssets(targetId, group) {
      const html = (reviewData.assets || []).map((a, i) => {
        const files = getFilesForObject(a, group);
        return '<div class="entity-review"><h2>' + t('Tai san ') + (i + 1) + '</h2>' + compareLayoutHtml(group + '-asset-' + i, files, assetCertificateHtml(a, i)) + '</div>';
      }).join('');
      document.getElementById(targetId).innerHTML = html || '<div class="loading">Khong co du lieu.</div>';
      hydrateAllSourceImages();
    }

    function isNewA4AssetCertificate(asset, ocrText) {
      const title = removeVietnameseMarks(valueOf(asset && asset.certificate_title) || inferCertificateTitleFromText(ocrText)).toLowerCase();
      const text = removeVietnameseMarks(String(ocrText || '')).toLowerCase().replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ');
      return title.indexOf('quyen so huu tai san gan lien voi dat') >= 0 ||
        text.indexOf('2 thong tin thua dat') >= 0 && text.indexOf('3 thong tin tai san gan lien voi dat') >= 0;
    }

    function valueOf(field) {
      if (!field) return '';
      if (typeof field === 'object' && Object.prototype.hasOwnProperty.call(field, 'final_value')) return cleanValue(field.final_value);
      return cleanValue(field);
    }

    function valueOrDash(value) {
      value = cleanValue(value);
      return value || '-/-';
    }

    function pushAssetLine(lines, label, value) {
      value = cleanValue(value);
      if (!value || isAbsentCertificateText(value)) return;
      lines.push('<div class="asset-doc-line">' + escapeHtml(label) + ': ' + escapeHtml(value) + '</div>');
    }

    function pushA4CertificateLine(lines, label, value) {
      lines.push('<div class="asset-doc-line">' + escapeHtml(label) + ': ' + escapeHtml(cleanValue(value)) + '</div>');
    }

    function a4CertificateNoteDisplayValue(value, ocrText) {
      const direct = cleanValue(value);
      if (direct && !isAbsentCertificateText(direct)) return direct;
      const fromOcr = certificateOptionalItemValue(ocrText, 5, '');
      return fromOcr && !isAbsentCertificateText(fromOcr) ? fromOcr : '-/-';
    }

    function a4PostIssueChangesDisplayValue(value, ocrText) {
      const direct = cleanPostIssueChangesDisplayValue(value);
      const normalized = removeVietnameseMarks(direct).toLowerCase().replace(/\s+/g, ' ').trim();
      if (direct && normalized !== 'khong co' && !isAbsentCertificateText(direct)) {
        return isUnclearPostIssueText(direct) ? 'Kh\u00f4ng r\u00f5, \u0111\u1ec1 ngh\u1ecb ki\u1ec3m tra' : direct;
      }
      const inferred = inferPostIssueChangesFromOcr(ocrText);
      const inferredNormalized = removeVietnameseMarks(inferred).toLowerCase().replace(/\s+/g, ' ').trim();
      if (!inferred || inferredNormalized === 'khong co' || inferredNormalized.indexOf('co noi dung nhung bi mo') === 0) return '';
      return inferred;
    }

    function oneLineCertificateValue(value) {
      return cleanValue(value).replace(/\s*\r?\n\s*/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function joinNonEmpty(items, separator) {
      return (items || []).map(cleanValue).filter(Boolean).join(separator || ' ');
    }

    function formatAreaWithWords(area, areaWords) {
      return joinNonEmpty([normalizeAreaForDisplay(area), normalizeAreaWordsForDisplay(areaWords)], ' ');
    }

    function normalizeAreaForDisplay(area) {
      const text = cleanValue(area).replace(/\s+/g, ' ').trim();
      const match = text.match(/([0-9]+(?:[,.][0-9]+)?)\s*m(?:2|²)?/i);
      return match ? match[1] + ' m\u00b2' : text;
    }

    function normalizeAreaWordsForDisplay(value) {
      let text = cleanValue(value);
      if (!text) return '';
      text = text.replace(/^\(+|\)+$/g, '').trim();
      text = text.replace(/^(?:B[Äƒa]ng\s+ch[á»¯u]|B\u1eb1ng\s+ch\u1eef|Bang\s+chu)\s*:\s*/i, '').trim();
      return text ? '(B\u1eb1ng ch\u1eef: ' + text + ')' : '';
    }

    function simplifyAbsentCertificateText(value) {
      value = cleanValue(value);
      if (!value || isAbsentCertificateText(value)) return 'Ch\u01b0a ch\u1ee9ng nh\u1eadn quy\u1ec1n s\u1edf h\u1eefu';
      return value;
    }

    function certificateOptionalItemValue(ocrText, number, fallback) {
      if (!ocrText) return fallback;
      const value = normalizeNumberedCertificateItemValue(extractNumberedCertificateItemFromOcr(ocrText, number), number);
      if (!value) return fallback;
      return isAbsentCertificateText(value) ? fallback : value;
    }

    function selectTrustedLandPlotOcrText(ocrText) {
      const selected = selectBestLandPlotOcrText(ocrText);
      return selected.trusted ? selected.text : '';
    }

    function selectBestLandPlotOcrText(ocrText) {
      const source = String(ocrText || '');
      const lines = source.split(/\r?\n/);
      let best = { text: '', score: 0, trusted: false };
      for (let i = 0; i < lines.length; i++) {
        const normalized = normalizeCertificateIndexLineForReview(lines[i]);
        if (normalized.indexOf('ii thua dat') < 0 && normalized.indexOf('1 thua dat') < 0 && normalized.indexOf('thua dat so') < 0) continue;
        const out = [];
        for (let j = i; j < lines.length; j++) {
          const current = normalizeCertificateIndexLineForReview(lines[j]);
          if (j > i && /^(?:iii|iv)\s+/.test(current)) break;
          if (j > i && current.indexOf('iv nhung thay doi') >= 0) break;
          out.push(lines[j]);
          if (j > i && /^(?:6|ghi chu)\b/.test(current) && out.length > 3) break;
        }
        const text = out.join('\n');
        const score = scoreLandPlotOcrTextForReview(text);
        if (score > best.score) best = { text: text, score: score, trusted: score >= 6 };
      }
      return best;
    }

    function normalizeCertificateIndexLineForReview(line) {
      return removeVietnameseMarks(line).toLowerCase().replace(/[.:)\-]+/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function scoreLandPlotOcrTextForReview(value) {
      const normalized = removeVietnameseMarks(value).toLowerCase().replace(/\s+/g, ' ').trim();
      let score = 0;
      if (normalized.indexOf('ii thua dat') >= 0) score += 2;
      if (normalized.indexOf('1 thua dat') >= 0) score += 2;
      if (normalized.indexOf('thua dat so') >= 0) score += 2;
      ['to ban do', 'dien tich', 'hinh thuc su dung', 'muc dich su dung', 'thoi han su dung', 'nguon goc su dung'].forEach(label => {
        if (normalized.indexOf(label) >= 0) score += 1;
      });
      if (normalized.indexOf('dia chi thuong tru') >= 0) score -= 3;
      if (normalized.indexOf('iv nhung thay doi') >= 0) score -= 1;
      return score;
    }

    function normalizeNumberedCertificateItemValue(value, number) {
      let text = oneLineCertificateValue(value).replace(/[.。]+$/g, '').trim();
      const labels = {
        2: /^(?:nh[aà]\s*[oở]|nha\s*o)\s*[:;.-]?\s*/i,
        3: /^(?:c[oô]ng\s*tr[ìi]nh\s*x[aâ]y\s*d[ựu]ng\s*kh[aá]c|cong\s*trinh\s*xay\s*dung\s*khac)\s*[:;.-]?\s*/i,
        4: /^(?:r[ưừ]ng\s*s[aả]n\s*xu[aấ]t\s*l[aà]\s*r[ưừ]ng\s*tr[oồ]ng|rung\s*san\s*xuat\s*la\s*rung\s*trong)\s*[:;.-]?\s*/i,
        5: /^(?:c[aâ]y\s*l[aâ]u\s*n[aă]m|cay\s*lau\s*nam)\s*[:;.-]?\s*/i,
        6: /^(?:ghi\s*ch[uú]|ghi\s*chu)\s*[:;.-]?\s*/i
      };
      if (labels[number]) text = text.replace(labels[number], '').trim();
      if (number === 6) {
        text = truncateCertificateNoteValue(text);
      }
      return text.replace(/^[;:.,\-\s]+|[;:.,\-\s]+$/g, '').trim();
    }

    function truncateCertificateNoteValue(value) {
      return String(value || '')
        .replace(/\s+(?:s\u1ed1|so)\s+v(?:\u00e0o|ao)\s+s(?:\u1ed5|\u1ed1|o)\s+c(?:\u1ea5p|ap)\s+(?:gcn|gi(?:\u1ea5y|ay)\s+ch(?:\u1ee9ng|ung)\s+nh(?:\u1eadn|an))\b.*$/i, '')
        .replace(/\s+iv\s*[\).:]?\s*nh(?:\u1eefng|ung)\s+thay\s+(?:\u0111\u1ed5i|doi)\b.*$/i, '')
        .trim();
    }

    function extractNumberedCertificateItemFromOcr(ocrText, number) {
      const text = String(ocrText || '').replace(/\r/g, '\n');
      const pattern = new RegExp('(?:^|\\n|\\s)' + number + '\\s*[\\).:]\\s*([\\s\\S]*?)(?=(?:\\n|\\s)(?:' + (number + 1) + '|IV|III|II)\\s*[\\).:]|$)', 'i');
      const match = text.match(pattern);
      return match ? oneLineCertificateValue(match[1]).replace(/^[;:.,\\-\\s]+|[;:.,\\-\\s]+$/g, '') : '';
    }

    function postIssueChangesDisplayValue(value, ocrText) {
      value = cleanPostIssueChangesDisplayValue(value);
      if (value && !isAbsentCertificateText(value)) {
        return isUnclearPostIssueText(value) ? 'Kh\u00f4ng r\u00f5, \u0111\u1ec1 ngh\u1ecb ki\u1ec3m tra' : value;
      }
      const inferred = inferPostIssueChangesFromOcr(ocrText);
      return inferred || 'Kh\u00f4ng c\u00f3';
    }

    function cleanPostIssueChangesDisplayValue(value) {
      return String(value || '').split(/\r?\n/)
        .map(line => stripPostIssueHeadingPrefix(line.replace(/\s+/g, ' ').trim()))
        .filter(Boolean)
        .join('\n')
        .trim();
    }

    function stripPostIssueHeadingPrefix(value) {
      const raw = String(value || '');
      const normalized = removeVietnameseMarks(raw).toLowerCase();
      const patterns = [
        /^\s*(?:(?:iv|6)\s*[\).:-]?\s*)?nhung\s+thay\s+doi\s+sau\s+khi\s+cap\s+giay\s+chung\s+nhan\s*[:.-]?\s*/,
        /^\s*noi\s+dung\s+thay\s+doi\s+va\s+co\s+so\s+phap\s+ly\s*[:.-]?\s*/
      ];
      for (const pattern of patterns) {
        const match = normalized.match(pattern);
        if (match) return raw.slice(match[0].length).trim();
      }
      return raw.trim();
    }

    function inferPostIssueChangesFromOcr(ocrText) {
      const lines = String(ocrText || '').split(/\r?\n/)
        .map(line => line.replace(/\s+/g, ' ').trim())
        .filter(Boolean);
      let start = -1;
      for (let i = 0; i < lines.length; i++) {
        const normalized = removeVietnameseMarks(lines[i]).toLowerCase();
        if (normalized.indexOf('iv') >= 0 && normalized.indexOf('nhung thay doi') >= 0) {
          start = i;
          break;
        }
      }
      if (start < 0) return '';
      const content = [];
      const startRemainder = stripPostIssueHeadingPrefix(lines[start]);
      if (startRemainder) content.push(startRemainder);
      for (let j = start + 1; j < lines.length; j++) {
        const line = stripPostIssueHeadingPrefix(lines[j]);
        if (!line) continue;
        const normalized = removeVietnameseMarks(line).toLowerCase();
        if (normalized.indexOf('xac nhan cua co quan') >= 0 ||
            normalized.indexOf('co tham quyen') >= 0 ||
            normalized.indexOf('giam doc') >= 0 ||
            normalized.indexOf('so tai nguyen') >= 0) {
          continue;
        }
        if (/^[ivx]+\s*[\).]/i.test(normalized) && content.length) break;
        content.push(line);
      }
      const cleaned = content.join('\n').replace(/\n{3,}/g, '\n\n').trim();
      if (!cleaned) return 'Kh\u00f4ng r\u00f5, \u0111\u1ec1 ngh\u1ecb ki\u1ec3m tra';
      if (isUnclearPostIssueText(cleaned)) return 'Kh\u00f4ng r\u00f5, \u0111\u1ec1 ngh\u1ecb ki\u1ec3m tra';
      return cleaned;
    }

    function isUnclearPostIssueText(value) {
      const text = removeVietnameseMarks(value).toLowerCase();
      if (text.indexOf('khong doc ro') >= 0 || text.indexOf('khong ro') >= 0 || text.indexOf('bi mo') >= 0) return true;
      const suspiciousTokens = ['chieri', 'theey', 'duttag', 'tras', 'hamdoc', 'cmind', ' phone ', ' for ', ' now ', ' byget ', ' taubin'];
      const suspiciousCount = suspiciousTokens.filter(token => text.indexOf(token) >= 0).length;
      if (suspiciousCount >= 2) return true;
      const letters = (text.match(/[a-z]/g) || []).length;
      const digits = (text.match(/[0-9]/g) || []).length;
      return letters < 20 && digits > 6;
    }

    function isAbsentCertificateText(value) {
      const text = removeVietnameseMarks(value).toLowerCase();
      return !cleanValue(value) || text.indexOf('chua chung nhan quyen so huu') >= 0 || text === '-/-' || text === '-';
    }

    function extractAreaWordsFromOcr(text) {
      const match = String(text || '').match(/\(?\s*B[ăa]ng ch[ữu]\s*:\s*([^)\\n]+)\)?/i);
      return match ? '(B\u1eb1ng ch\u1eef: ' + cleanValue(match[1]) + ')' : '';
    }

    function ownerLines(asset, suppressAddress) {
      const summary = valueOf(asset.owner_identity_summary);
      const addresses = suppressAddress ? [] : valueOf(asset.owner_address).split(';').map(v => v.trim()).filter(Boolean);
      if (summary) {
        return summary.split(';').map((v, i) => {
          const line = v.trim();
          const address = addresses[i] || addresses[0] || '';
          return line && address ? line + ', \u0110\u1ecba ch\u1ec9: ' + address : line;
        }).filter(Boolean);
      }
      const names = valueOf(asset.owner_name).split(';').map(v => v.trim()).filter(Boolean);
      const ids = valueOf(asset.owner_id_number).split(';').map(v => v.trim()).filter(Boolean);
      const docTypes = valueOf(asset.owner_id_document_type).split(';').map(v => v.trim()).filter(Boolean);
      if (!names.length && !ids.length && !addresses.length) return [''];
      const max = Math.max(names.length, ids.length, addresses.length);
      const out = [];
      for (let i = 0; i < max; i++) {
        const name = names[i] || names[0] || '';
        const docType = docTypes[i] || docTypes[0] || 'giay to tuy than';
        const id = ids[i] || '';
        const address = addresses[i] || addresses[0] || '';
        out.push((name ? name : '') + (id ? ', ' + docType + ': ' + id : '') + (address ? ', \u0110\u1ecba ch\u1ec9: ' + address : ''));
      }
      return out;
    }

    function getAssetOcrText() {
      return (reviewData.ocr_results || []).filter(o => o.group === 'asset').map(o => o.text_preview || '').join('\n');
    }

    function inferCertificateTitleFromText(text) {
      const lines = String(text || '').split(/\r?\n/).map(line => line.replace(/\s+/g, ' ').trim()).filter(Boolean);
      for (let i = 0; i < lines.length; i++) {
        const current = removeVietnameseMarks(lines[i]).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
        if (current.indexOf('giay chung nhan') < 0) continue;
        const parts = [sliceCertificateTitleStart(lines[i])];
        for (let j = i + 1; j < lines.length && parts.length < 5; j++) {
          const next = removeVietnameseMarks(lines[j]).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
          if (!next) continue;
          if (isCertificateTitleStopLine(next)) break;
          if (!isCertificateTitleContinuationLine(next)) break;
          parts.push(lines[j]);
        }
        const title = cleanCertificateTitleForReview(parts.join(' '));
        if (title && removeVietnameseMarks(title).toLowerCase().trim() !== 'giay chung nhan') return title;
      }
      return '';
    }

    function sliceCertificateTitleStart(line) {
      const match = String(line || '').match(/(gi\u1ea5y|giay)\s+(ch\u1ee9ng|chung)\s+(nh\u1eadn|nhan)/i);
      return match ? String(line || '').slice(match.index).trim() : String(line || '').trim();
    }

    function isCertificateTitleStopLine(line) {
      return line.indexOf('so phat hanh') >= 0 ||
        line.indexOf('so vao so') >= 0 ||
        /^so\s+[a-z]{1,5}\s*\d/i.test(line) ||
        line.indexOf('i nguoi su dung') === 0 ||
        line.indexOf('ii thua dat') === 0 ||
        line.indexOf('iii so do') === 0 ||
        line.indexOf('uy ban nhan dan') >= 0 ||
        /^(?:[ivx]+|[0-9]+)\s/.test(line);
    }

    function isCertificateTitleContinuationLine(line) {
      if (/^(cong hoa|doc lap|uy ban|bo tai nguyen|so tai nguyen|van phong dang ky)\b/.test(line)) return false;
      if (/^(ngay|noi cap|cap ngay|ky ngay|ma vach)\b/.test(line)) return false;
      return line.length <= 160;
    }

    function cleanCertificateTitleForReview(value) {
      return accentCertificateTitleForReview(String(value || '')
        .replace(/\s+/g, ' ')
        .replace(/\s+,/g, ',')
        .replace(/,\s*/g, ', ')
        .trim());
    }

    function displayUsageOriginValue(value) {
      return accentUsageOriginForReview(cleanValue(value));
    }

    function accentUsageOriginForReview(value) {
      let text = String(value || '').replace(/\s+/g, ' ').trim();
      if (!text) return '';
      text = text
        .replace(/\bnhan\s+chuyen\s+nhuong\b/ig, 'nh\u1eadn chuy\u1ec3n nh\u01b0\u1ee3ng')
        .replace(/\bduoc\b/ig, '\u0111\u01b0\u1ee3c')
        .replace(/\bnha\s+nuoc\b/ig, 'Nh\u00e0 n\u01b0\u1edbc')
        .replace(/\bco\s+thu\s+tien\s+su\s+dung\s+dat\b/ig, 'c\u00f3 thu ti\u1ec1n s\u1eed d\u1ee5ng \u0111\u1ea5t')
        .replace(/\bc\u00f3\s+thu\s+ti\u1ec1n\s+s\u1eed\s+dung\s+\u0111\u1ea5t\b/ig, 'c\u00f3 thu ti\u1ec1n s\u1eed d\u1ee5ng \u0111\u1ea5t')
        .replace(/\bsu\s+dung\s+dat\b/ig, 's\u1eed d\u1ee5ng \u0111\u1ea5t')
        .replace(/\bs\u1eed\s+dung\s+\u0111\u1ea5t\b/ig, 's\u1eed d\u1ee5ng \u0111\u1ea5t')
        .replace(/\bthu\s+tien\b/ig, 'thu ti\u1ec1n')
        .replace(/\bdat\b/ig, '\u0111\u1ea5t');
      return fixVietnameseUsageWord(text).replace(/^nh\u1eadn\b/, 'Nh\u1eadn').trim();
    }

    function fixVietnameseUsageWord(value) {
      return String(value || '').replace(/s\u1eed\s+dung/ig, 's\u1eed d\u1ee5ng');
    }

    function accentCertificateTitleForReview(value) {
      const map = {
        giay: 'gi\u1ea5y', chung: 'ch\u1ee9ng', nhan: 'nh\u1eadn',
        quyen: 'quy\u1ec1n', su: 's\u1eed', dung: 'd\u1ee5ng', dat: '\u0111\u1ea5t',
        so: 's\u1edf', huu: 'h\u1eefu', hwuux: 'h\u1eefu', hwux: 'h\u1eefu', huux: 'h\u1eefu',
        nha: 'nh\u00e0', o: '\u1edf', va: 'v\u00e0', tai: 't\u00e0i', san: 's\u1ea3n',
        khac: 'kh\u00e1c', gan: 'g\u1eafn', lien: 'li\u1ec1n', voi: 'v\u1edbi'
      };
      let previousKey = '';
      return String(value || '').split(/(\s+|,\s*)/).map(token => {
        const key = removeVietnameseMarks(token).toLowerCase().replace(/[^a-z]/g, '');
        if (!key) return token;
        let replacement = map[key] || '';
        if (key === 'dung' && previousKey !== 'su') replacement = '';
        if (key === 'so' && previousKey !== 'quyen') replacement = '';
        if ((key === 'huu' || key === 'hwuux' || key === 'hwux' || key === 'huux') && previousKey !== 'so') replacement = '';
        if (key === 'o' && previousKey !== 'nha') replacement = '';
        previousKey = key;
        return replacement || token;
      }).join('').replace(/^gi\u1ea5y/, 'Gi\u1ea5y');
    }

    function inferCertificateNumberFromText(text) {
      const matches = String(text || '').match(/\b[A-Z]{1,3}\s*[0-9]{6,9}\b/g) || [];
      return matches.length ? matches[0].replace(/\s+/g, ' ').trim() : '';
    }

    function inferRegistryNumberFromText(text) {
      const raw = String(text || '');
      const normalized = removeVietnameseMarks(raw).replace(/\s+/g, ' ');
      const direct = normalized.match(/(?:so vao so|vao so cap gcn|so cap gcn|registry)[^A-Z0-9]{0,80}((?:C\s*\.\s*N\s*\.|CS|CT|CN|CH|CL|HX|VP|DC|DL)\s*[0-9][A-Z0-9.\\/-]{1,20})/i);
      if (direct) return normalizeRegistryForReview(direct[1], /\.{4,}/.test(direct[0]));
      const candidates = normalized.match(/\b(?:CS|CT|CN|CH|CL|HX|VP|DC|DL)[0-9][A-Z0-9.\\/-]{1,20}\b/gi) || [];
      return candidates.length ? normalizeRegistryForReview(candidates[0]) : '';
    }

    function normalizeRegistryForReview(value, hasPrintedFillLine) {
      let text = String(value || '')
        .replace(/\.{4,}/g, ' ')
        .replace(/\s+/g, '')
        .trim();
      if (hasPrintedFillLine) text = text.replace(/\./g, '');
      return text.toUpperCase();
    }

    function titleCaseAgency(value) {
      value = cleanValue(value);
      if (!value) return '';
      let text = value.toLocaleLowerCase('vi-VN');
      text = text.charAt(0).toLocaleUpperCase('vi-VN') + text.slice(1);
      text = normalizeLandRegistrationAgencyCasing(text);
      ['huyện', 'quận', 'thành phố', 'thị xã', 'tỉnh', 'xã', 'phường', 'thị trấn'].forEach(prefix => {
        const re = new RegExp('(' + prefix + '\\s+)([a-zà-ỹ]+)(\\s+([a-zà-ỹ]+))?', 'gi');
        text = text.replace(re, function(match, p1, w1, p3, w2) {
          return p1 + capitalizeViWord(w1) + (p3 ? ' ' + capitalizeViWord(w2) : '');
        });
      });
      return text;
    }

    function normalizeLandRegistrationAgencyCasing(value) {
      let text = String(value || '').replace(/\s+/g, ' ').trim();
      const normalized = removeVietnameseMarks(text).toLowerCase().replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
      if (normalized.indexOf('chi nhanh van phong dang ky dat dai ') === 0) {
        return 'Chi nh\u00e1nh V\u0103n ph\u00f2ng \u0111\u0103ng k\u00fd \u0111\u1ea5t \u0111ai ' +
          titleCaseVietnameseWords(text.split(/\s+/).slice(8).join(' '));
      }
      if (normalized.indexOf('van phong dang ky dat dai ') === 0) {
        return 'V\u0103n ph\u00f2ng \u0111\u0103ng k\u00fd \u0111\u1ea5t \u0111ai ' +
          titleCaseVietnameseWords(text.split(/\s+/).slice(6).join(' '));
      }
      return text;
    }

    function titleCaseVietnameseWords(value) {
      return String(value || '').split(/\s+/).filter(Boolean).map(capitalizeViWord).join(' ');
    }

    function capitalizeViWord(word) {
      word = String(word || '');
      return word ? word.charAt(0).toLocaleUpperCase('vi-VN') + word.slice(1).toLocaleLowerCase('vi-VN') : '';
    }

    function removeVietnameseMarks(value) {
      return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\u0111/g, 'd').replace(/\u0110/g, 'D');
    }

    function compareLayoutHtml(scopeId, files, dataHtml) {
      return '<div class="review-split"><aside class="source-panel"><div class="image-list">' + sourceImagesHtml(scopeId, files) + '</div></aside><section class="data-panel">' + dataHtml + '</section></div>';
    }

    function sourceImagesHtml(scopeId, files) {
      files = sortSourceFiles(files || []);
      if (!files.length) return '<div>Khong co</div>';
      return files.map((file, i) => '<div class="source-image-card"><div class="source-image-title">' + escapeHtml(file.file_name) + '</div><div class="source-image-tools"><button onclick="rotateReviewImage(\'imgframe-' + escapeAttr(scopeId) + '-' + i + '\', -90)">Xoay trai</button><button onclick="rotateReviewImage(\'imgframe-' + escapeAttr(scopeId) + '-' + i + '\', 90)">Xoay phai</button></div><div class="source-image-frame" id="imgframe-' + escapeAttr(scopeId) + '-' + i + '" data-file-id="' + escapeAttr(file.file_id) + '" data-file-name="' + escapeAttr(file.file_name) + '" data-ocr-rotation="' + escapeAttr(file.orientation_degrees || 0) + '">Dang tai anh...</div></div>').join('');
    }

    function sortSourceFiles(files) {
      return (files || []).map((file, index) => ({ file, index }))
        .sort((a, b) => fileSideRank(a.file) - fileSideRank(b.file) || a.index - b.index)
        .map(item => item.file);
    }

    function fileSideRank(file) {
      const text = removeVietnameseMarks(((file && file.file_name) || '') + ' ' + ((file && file.text_preview) || '')).toLowerCase();
      const frontScore =
        (text.indexOf('can cuoc cong dan') >= 0 ? 3 : 0) +
        (text.indexOf('ho va ten') >= 0 || text.indexOf('full name') >= 0 ? 3 : 0) +
        (text.indexOf('ngay sinh') >= 0 || text.indexOf('date of birth') >= 0 ? 2 : 0) +
        (text.indexOf('que quan') >= 0 ? 1 : 0) +
        (/\bso\s*\/?\s*no\b/.test(text) ? 1 : 0);
      const backScore =
        (text.indexOf('idvnm') >= 0 ? 3 : 0) +
        (text.indexOf('ngay cap') >= 0 || text.indexOf('date of issue') >= 0 ? 3 : 0) +
        (text.indexOf('dac diem nhan dang') >= 0 || text.indexOf('personal identification') >= 0 ? 2 : 0) +
        (text.indexOf('noi cu tru') >= 0 || text.indexOf('place of residence') >= 0 ? 1 : 0) +
        (/<{3,}/.test(text) ? 2 : 0);
      if (frontScore >= 3 && frontScore > backScore) return 0;
      if (backScore >= 3 && backScore > frontScore) return 20;
      return 10;
    }

    function getFilesForObject(obj, group) {
      const groupFiles = getFilesByGroup(group);
      if (group === 'asset') return groupFiles;
      const id = normalizeReviewId(obj && obj.id_number && obj.id_number.final_value);
      if (!id) return [];
      return groupFiles.filter(file => (file.id_numbers || []).map(normalizeReviewId).indexOf(id) >= 0 || normalizeReviewId(file.text_preview || '').indexOf(id) >= 0);
    }

    function normalizeReviewId(value) {
      return String(value || '').replace(/\D/g, '');
    }
    function getFilesByGroup(group) {
      return (reviewData.ocr_results || []).filter(f => f.group === group);
    }

    async function hydrateAllSourceImages() {
      const frames = Array.from(document.querySelectorAll('.source-image-frame[data-file-id]'));
      for (const frame of frames) {

          imageCache[fileId] = preview;

            frame.innerHTML = '<img src="' + preview.data_url + '" alt="' + escapeAttr(preview.file_name || fileName) + '" data-rotation="0" onload="autoOrientReviewImage(this)">';
          } else {
            frame.innerHTML = '<div>File nay khong phai anh preview truc tiep.<br>' + escapeHtml(fileName) + '<br>Vao tab OCR de xem text.</div>';
          }

      }
      autoRepairIdentityIssueDatesFromImageCrops();

    async function autoRepairIdentityIssueDatesFromImageCrops() {
      if (autoOcrBusy || !reviewData) return;
      autoOcrBusy = true;
      try {
        const jobs = [];
        collectIdentityIssueDateJobs_(reviewData.secured_parties || [], 'secured_parties', 'secured_party', jobs);
        collectIdentityIssueDateJobs_(reviewData.obligors || [], 'obligors', 'obligor', jobs);
        for (const job of jobs) {
          if (autoOcrDonePaths[job.fieldPath]) continue;
          autoOcrDonePaths[job.fieldPath] = true;
          const date = await readIssueDateFromIdentityFiles_(job.files);
          if (!date) continue;
          const saved = await api('saveAutoOcrFieldValue', {
            fieldPath: job.fieldPath,
            newValue: date,
            source: 'AUTO_OCR_IDENTITY_CROP'
          });
          if (saved && saved.ok) {
            job.field.ai_value = date;
            job.field.final_value = date;
            job.field.source = 'AUTO_OCR_IDENTITY_CROP';
            job.field.confidence = '0.9';
            render();
            break;
          }
        }
      } catch (err) {
        console.warn('Auto OCR identity issue date failed', err);
      } finally {
        autoOcrBusy = false;
      }
    }

    function collectIdentityIssueDateJobs_(people, root, group, jobs) {
      (people || []).forEach(function(person, index) {
        const field = person && person.id_issue_date;
        if (!isMissingAutoOcrField_(field)) return;
        const files = getFilesForObject(person, group);
        if (!files.length) return;
        jobs.push({
          fieldPath: root + '[' + index + '].id_issue_date',
          field: field,
          files: files
        });
      });
    }

    function isMissingAutoOcrField_(field) {
      if (!field || field.manual_value) return false;
      const value = cleanValue(field.final_value || field.ai_value);
      if (!value) return true;
      if (removeVietnameseMarks(value).toLowerCase().indexOf('khong ro') >= 0) return true;
      return !isValidReviewDate_(value);
    }

    function isValidReviewDate_(value) {
      const match = cleanValue(value).match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
      if (!match) return false;
      const day = Number(match[1]);
      const month = Number(match[2]);
      const year = Number(match[3]);
      if (year < 1900 || year > 2099 || month < 1 || month > 12 || day < 1 || day > 31) return false;
      const daysInMonth = [31, isLeapYearReview_(year) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][month - 1];
      return day <= daysInMonth;
    }

    function isLeapYearReview_(year) {
      return year % 400 === 0 || (year % 4 === 0 && year % 100 !== 0);
    }

    async function autoRepairAssetRegistryNumbersFromImageCrops() {
      if (autoRegistryOcrBusy || !reviewData) return;
      autoRegistryOcrBusy = true;
      try {
        const jobs = [];
        (reviewData.assets || []).forEach(function(asset, index) {
          const field = asset && asset.real_estate && asset.real_estate.registry_number;
          if (!needsLandRegistryCropVerification_(field)) return;

          const fallbackFiles = files.length ? files : getLandCertificateFilesFromOcr_();
          if (!fallbackFiles.length) return;
          jobs.push({
            fieldPath: 'assets[' + index + '].real_estate.registry_number',
            field: field,
            files: fallbackFiles
          });
        });
        for (const job of jobs) {
          if (autoOcrDonePaths[job.fieldPath]) continue;
          autoOcrDonePaths[job.fieldPath] = true;
          const currentValue = cleanValue(job.field.final_value || job.field.ai_value);
          const verification = await readLandRegistryFromAssetFiles_(job.files, currentValue);
          if (!verification.registry_number) continue;
          const saved = await api('saveAutoOcrRegistryValue', {
            fieldPath: job.fieldPath,
            newValue: verification.registry_number,
            currentValue: currentValue,
            readings: verification.readings,
            verificationMode: verification.verification_mode || ''
          });
          if (saved && saved.ok) {
            job.field.ai_value = verification.registry_number;
            job.field.final_value = verification.registry_number;
            job.field.source = verification.verification_mode === 'PAGE_ANCHORED'
              ? 'AUTO_OCR_LAND_REGISTRY_ANCHORED_PAGE_CROP_CONSENSUS'
              : 'AUTO_OCR_LAND_REGISTRY_CROP_CONSENSUS';
            job.field.confidence = '0.92';
            render();
          }
        }
      } catch (err) {
        console.warn('Auto OCR land registry failed', err);
      } finally {
        autoRegistryOcrBusy = false;
      }
    }

    function needsLandRegistryCropVerification_(field) {
      if (!field || field.manual_value) return false;

    }

    async function autoRepairAssetIssueDatesFromImageCrops() {

        }
      } catch (err) {
        console.warn('Auto OCR land issue date failed', err);
      } finally {
        autoIssueDateOcrBusy = false;

    function needsLandIssueDateCropVerification_(field) {
      if (!field || field.manual_value) return false;
