    async function autoRepairA4CertificateFieldsFromCrops() {
      if (autoA4OcrBusy || !reviewData) return;
      autoA4OcrBusy = true;
      try {
        let changed = false;
        for (let index = 0; index < (reviewData.assets || []).length; index++) {
          const asset = reviewData.assets[index];
          const re = asset && asset.real_estate || {};
          if (!isNewA4AssetCertificate(asset, getAssetOcrText())) continue;
          const jobs = [
            {
              key: 'issue_date',
              path: 'assets[' + index + '].real_estate.issue_date',
              field: re.issue_date,
              missing: isMissingAutoOcrField_(re.issue_date),
              source: 'AUTO_OCR_A4_ISSUE_DATE_CROP'
            },
            {
              key: 'usage_purpose',
              path: 'assets[' + index + '].real_estate.usage_purpose',
              field: re.usage_purpose,
              missing: isMissingA4CertificateTextField_(re.usage_purpose),
              source: 'AUTO_OCR_A4_LAND_CROP'
            },
            {
              key: 'usage_term',
              path: 'assets[' + index + '].real_estate.usage_term',
              field: re.usage_term,
              missing: isMissingA4CertificateTextField_(re.usage_term),
              source: 'AUTO_OCR_A4_LAND_CROP'
            }
          ].filter(job => job.missing && !autoOcrDonePaths[job.path]);
          if (!jobs.length) continue;
          jobs.forEach(job => { autoOcrDonePaths[job.path] = true; });
          const files = uniqueReviewFiles_(getFilesForObject(asset, 'asset').concat(getLandCertificateFilesFromOcr_()));
          const result = await readA4CertificateFieldsFromFiles_(files, {
            issueDate: jobs.some(job => job.key === 'issue_date'),
            landFields: jobs.some(job => job.key !== 'issue_date')
          });
          for (const job of jobs) {
            const newValue = cleanValue(result && result[job.key]);
            if (!newValue) continue;
            const source = result && result._sources && result._sources[job.key] || job.source;
            const saved = await api('saveAutoOcrFieldValue', {
              fieldPath: job.path,
              newValue: newValue,
              source: source
            });
            if (!saved || !saved.ok) continue;
            job.field.ai_value = newValue;
            job.field.final_value = newValue;
            job.field.source = source;
            job.field.confidence = '0.9';
            changed = true;
          }
        }
        if (changed) render();
      } catch (err) {
        console.warn('Auto OCR A4 certificate fields failed', err);
      } finally {
        autoA4OcrBusy = false;
      }
    }

    function isMissingA4CertificateTextField_(field) {
      if (!field || field.manual_value) return false;
      return !cleanValue(field.final_value || field.ai_value);
    }

    async function readA4CertificateFieldsFromFiles_(files, needs) {
      const out = { issue_date: '', usage_purpose: '', usage_term: '', _sources: {} };
      const ordered = (files || []).slice().sort((a, b) => {
        const aPdf = String(a.file_type || '').toLowerCase() === 'application/pdf' ? 0 : 1;
        const bPdf = String(b.file_type || '').toLowerCase() === 'application/pdf' ? 0 : 1;
        return aPdf - bPdf;
      });
      for (const file of ordered) {
        if (!file.file_id && !file.file_name) continue;
        try {
          const read = await api('extractA4LandCertificateFieldsFromStoredOcr', {
            fileId: file.file_id || '',
            fileName: file.file_name || ''
          });
          autoA4OcrDebug.push({
            stage: 'stored_ocr',
            file: file.file_name || file.file_id || '',
            reason: read && read.reason,
            rawLength: read && read.raw_length,
            issueDate: Boolean(read && read.issue_date),
            usagePurpose: Boolean(read && read.usage_purpose),
            usageTerm: Boolean(read && read.usage_term)
          });
          if (needs.landFields) {
            if (!out.usage_purpose && cleanValue(read && read.usage_purpose)) {
              out.usage_purpose = cleanValue(read && read.usage_purpose);
              out._sources.usage_purpose = 'AUTO_OCR_A4_STORED_TEXT';
            }
            if (!out.usage_term && cleanValue(read && read.usage_term)) {
              out.usage_term = cleanValue(read && read.usage_term);
              out._sources.usage_term = 'AUTO_OCR_A4_STORED_TEXT';
            }
          }
          if (needs.issueDate) {
            if (!out.issue_date && cleanValue(read && read.issue_date)) {
              out.issue_date = cleanValue(read && read.issue_date);
              out._sources.issue_date = 'AUTO_OCR_A4_STORED_TEXT';
            }
          }
          if ((!needs.landFields || out.usage_purpose && out.usage_term) && (!needs.issueDate || out.issue_date)) return out;
        } catch (err) {
          autoA4OcrDebug.push({
            stage: 'stored_ocr_error',
            file: file.file_name || file.file_id || '',
            error: err && err.message ? err.message : String(err)
          });
          console.warn('A4 stored OCR extraction failed', file && file.file_name, err);
        }
      }
      for (const file of ordered) {
        if (!file.file_id) continue;
        const preview = imageCache[file.file_id] || await api('getCaseImagePreview', { fileId: file.file_id });
        imageCache[file.file_id] = preview;
        if (!preview || !preview.is_image || !preview.data_url) {
          autoA4OcrDebug.push({
            stage: 'preview_missing',
            file: file.file_name || file.file_id || '',
            isImage: Boolean(preview && preview.is_image)
          });
          continue;
        }
        const boxes = await buildA4CertificateCropCandidates_(preview.data_url);
        if (needs.landFields && (!out.usage_purpose || !out.usage_term)) {
          for (const box of boxes.land) {
            const dataUrl = await cropDataUrlFromImage_(preview.data_url, box, { scale: 3, enhance: true });
            if (!dataUrl) continue;
            const read = await api('ocrA4LandCertificateCrop', { dataUrl: dataUrl, cropType: 'land_fields' });
            autoA4OcrDebug.push({
              stage: 'land_crop',
              file: file.file_name || file.file_id || '',
              reason: box.reason,
              rawLength: read && read.raw_text ? read.raw_text.length : 0,
              usagePurpose: Boolean(read && read.usage_purpose),
              usageTerm: Boolean(read && read.usage_term)
            });
            if (!out.usage_purpose && cleanValue(read && read.usage_purpose)) {
              out.usage_purpose = cleanValue(read && read.usage_purpose);
              out._sources.usage_purpose = 'AUTO_OCR_A4_LAND_CROP';
            }
            if (!out.usage_term && cleanValue(read && read.usage_term)) {
              out.usage_term = cleanValue(read && read.usage_term);
              out._sources.usage_term = 'AUTO_OCR_A4_LAND_CROP';
            }
            if (out.usage_purpose && out.usage_term) break;
          }
        }
        if (needs.issueDate && !out.issue_date) {
          for (const box of boxes.date) {
            const dataUrl = await cropDataUrlFromImage_(preview.data_url, box, { scale: 3, enhance: true });
            if (!dataUrl) continue;
            const read = await api('ocrA4LandCertificateCrop', { dataUrl: dataUrl, cropType: 'issue_date' });
            autoA4OcrDebug.push({
              stage: 'date_crop',
              file: file.file_name || file.file_id || '',
              reason: box.reason,
              rawLength: read && read.raw_text ? read.raw_text.length : 0,
              issueDate: Boolean(read && read.issue_date)
            });
            if (cleanValue(read && read.issue_date)) {
              out.issue_date = cleanValue(read && read.issue_date);
              out._sources.issue_date = 'AUTO_OCR_A4_ISSUE_DATE_CROP';
            }
            if (out.issue_date) break;
          }
        }
        if ((!needs.landFields || out.usage_purpose && out.usage_term) && (!needs.issueDate || out.issue_date)) break;
      }
      return out;
    }

    function buildA4CertificateCropCandidates_(dataUrl) {
      return new Promise(function(resolve) {
        const img = new Image();
        img.onload = function() {
          const w = img.naturalWidth;
          const h = img.naturalHeight;
          resolve({
            land: [
              { x: Math.round(w * 0.04), y: Math.round(h * 0.14), width: Math.round(w * 0.92), height: Math.round(h * 0.31), reason: 'a4_land_fields' },
              { x: Math.round(w * 0.01), y: Math.round(h * 0.11), width: Math.round(w * 0.98), height: Math.round(h * 0.39), reason: 'a4_land_fields_wide' }
            ],
            date: [
              { x: Math.round(w * 0.45), y: Math.round(h * 0.61), width: Math.round(w * 0.52), height: Math.round(h * 0.17), reason: 'a4_issue_date' },
              { x: Math.round(w * 0.34), y: Math.round(h * 0.56), width: Math.round(w * 0.64), height: Math.round(h * 0.25), reason: 'a4_issue_date_wide' }
            ]
          });
        };
        img.onerror = function() { resolve({ land: [], date: [] }); };
        img.src = dataUrl;
      });
    }

    function getLandCertificateFilesFromOcr_() {
      return (reviewData.ocr_results || []).filter(function(file) {
        const fileName = removeVietnameseMarks((file && file.file_name) || '').toLowerCase();
        const textPreview = removeVietnameseMarks((file && file.text_preview) || '').toLowerCase();
        const text = fileName + ' ' + textPreview;
        const fileType = String(file && file.file_type || '').toLowerCase();
        const looksLikeLandCertificateName =
          /\bgcn\b/.test(fileName) ||
          fileName.indexOf('qsdd') >= 0 ||
          fileName.indexOf('qsd') >= 0 ||
          fileName.indexOf('bia dat') >= 0 ||
          fileName.indexOf('so do') >= 0;
        if (file && file.file_id && fileType === 'application/pdf' && looksLikeLandCertificateName) {
          return true;
        }
        return text.indexOf('giay chung nhan') >= 0 ||
          text.indexOf('quyen su dung dat') >= 0 ||
          text.indexOf('thua dat') >= 0 ||
          text.indexOf('so vao so') >= 0 ||
          text.indexOf('dien tich') >= 0;
      });
    }

    function uniqueReviewFiles_(files) {
      const seen = {};
      const out = [];
      (files || []).forEach(function(file) {
        if (!file) return;
        const key = String(file.file_id || file.file_name || '');
        if (!key || seen[key]) return;
        seen[key] = true;
        out.push(file);
      });
      return out;
    }

    async function readIssueDateFromIdentityFiles_(files) {
      for (const file of files || []) {
        if (!file.file_id) continue;
        const preview = imageCache[file.file_id] || await api('getCaseImagePreview', { fileId: file.file_id });
        imageCache[file.file_id] = preview;
        if (!preview || !preview.is_image || !preview.data_url) continue;
        const suggestion = await api('suggestIdentityIssueDateCrop', { fileId: file.file_id });
        if (!suggestion || !suggestion.ok || !suggestion.crop) continue;
        const cropDataUrl = await cropDataUrlFromImage_(preview.data_url, suggestion.crop);
        if (!cropDataUrl) continue;
        const ocr = await api('ocrIdentityIssueDateCrop', { dataUrl: cropDataUrl });
        if (ocr && ocr.date) return ocr.date;
      }
      return '';
    }

    async function readLandIssueDateFromAssetFiles_(files) {
      for (const file of files || []) {
        if (!file.file_id) continue;
        let found = null;
        await forEachRegistryPageImage_(file, async function(pageImage) {
          const suggestedCrop = await suggestLandIssueDateCropForPageImage_(pageImage.data_url);
          const crops = await buildLandIssueDateCropCandidates_(pageImage.data_url, suggestedCrop);
          for (const crop of crops) {
            const readings = [];
            for (const colorMode of ['color', 'gray']) {
              const dataUrl = await cropDataUrlFromImage_(pageImage.data_url, crop, {
                scale: pageImage.high_resolution ? 1 : 3,
                colorMode: colorMode,
                enhance: colorMode === 'color',
                rotation: crop.rotation || 0
              });
              if (!dataUrl) continue;
              const read = await api('ocrA4LandCertificateCrop', { dataUrl: dataUrl, cropType: 'issue_date' });
              const date = normalizeReviewDateValue_(read && read.issue_date);
              if (date) readings.push(date);
            }
            if (readings.length === 2 && readings[0] === readings[1]) {
              found = {
                issue_date: readings[0],
                readings: readings
              };
              return false;
            }
          }
          return true;
        });
        if (found) return found;
      }
      return { issue_date: '', readings: [] };
    }

    async function suggestLandIssueDateCropForPageImage_(dataUrl) {
      const scaled = await scaleImageForRegistrySuggestion_(dataUrl, 2400);
      if (!scaled || !scaled.data_url) return null;
      const result = await api('suggestLandIssueDateCropFromImage', { dataUrl: scaled.data_url });
      const crop = result && result.crop;
      if (!result || !result.ok || !crop) return null;
      return {
        x: Math.round((crop.x || 0) * scaled.scale_x),
        y: Math.round((crop.y || 0) * scaled.scale_y),
        width: Math.round((crop.width || 0) * scaled.scale_x),
        height: Math.round((crop.height || 0) * scaled.scale_y),
        reason: crop.reason || 'vision_land_issue_date_line',
        anchor_text: crop.anchor_text || ''
      };
    }

    function buildLandIssueDateCropCandidates_(dataUrl, suggestedBox) {
      return new Promise(function(resolve) {
        const img = new Image();
        img.onload = function() {
          const w = img.naturalWidth;
          const h = img.naturalHeight;
          const out = [];
          if (suggestedBox) {
            out.push(suggestedBox);
            out.push(expandCropBox_(suggestedBox, w, h, 1.0, 1.0, 0.9, 1.1));
            out.push(expandCropBox_(suggestedBox, w, h, 2.0, 2.0, 1.2, 1.4));
          }
          out.push({ x: Math.round(w * 0.16), y: Math.round(h * 0.58), width: Math.round(w * 0.54), height: Math.round(h * 0.12), reason: 'land_issue_date_lower_center' });
          out.push({ x: Math.round(w * 0.08), y: Math.round(h * 0.54), width: Math.round(w * 0.68), height: Math.round(h * 0.18), reason: 'land_issue_date_lower_wide' });
          out.push({ x: Math.round(w * 0.26), y: Math.round(h * 0.60), width: Math.round(w * 0.44), height: Math.round(h * 0.10), reason: 'land_issue_date_signature_line' });
          out.push({ x: Math.round(w * 0.34), y: Math.round(h * 0.56), width: Math.round(w * 0.64), height: Math.round(h * 0.25), reason: 'land_issue_date_a4_wide' });
          resolve(out.filter(Boolean));
        };
        img.onerror = function() { resolve(suggestedBox ? [suggestedBox] : []); };
        img.src = dataUrl;
      });
    }

    function normalizeReviewDateValue_(value) {
      const text = cleanValue(value);
      const match = text.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
      if (!match) return '';
      const day = String(Number(match[1])).padStart(2, '0');
      const month = String(Number(match[2])).padStart(2, '0');
      const year = String(Number(match[3]));
      const normalized = day + '/' + month + '/' + year;
      return isValidReviewDate_(normalized) ? normalized : '';
    }

    async function readLandRegistryFromAssetFiles_(files, expectedValue) {
      const fallbackVotes = {};
      const expectedRegistry = normalizeRegistryCropReading_(expectedValue);
      const focusedCandidates = [];
      let immediateFocusedCandidate = null;
      for (const file of files || []) {
        if (!file.file_id) continue;
        await forEachRegistryPageImage_(file, async function(pageImage) {
          const suggestedCrop = pageImage.suggested_crop ||
            await suggestRegistryCropForPageImage_(pageImage.data_url);
          const crops = await buildLandRegistryCropCandidates_(pageImage.data_url, suggestedCrop);
          for (const crop of crops) {
            const focused = crop.reason.indexOf('_focused') >= 0;
            if (focused) {
              const focusedReadings = [];
              for (const colorMode of ['color', 'gray']) {
                const cropDataUrl = await cropDataUrlFromImage_(pageImage.data_url, crop, {
                  scale: pageImage.high_resolution ? 1 : 3,
                  colorMode: colorMode,
                  rotation: crop.rotation || 0
                });
                if (!cropDataUrl) continue;
                const ocr = await api('ocrLandRegistryCrop', { dataUrl: cropDataUrl });
                const registry = normalizeRegistryCropReading_(ocr && ocr.registry_number);
                if (registry) focusedReadings.push(registry);
              }
              if (focusedReadings.length === 2 && focusedReadings[0] === focusedReadings[1]) {
                const candidate = {
                  value: focusedReadings[0],
                  readings: focusedReadings,
                  page_index: pageImage.page_index
                };
                focusedCandidates.push(candidate);
                if (chooseFocusedRegistryCandidate_([candidate], expectedRegistry)) {
                  immediateFocusedCandidate = candidate;
                  return false;
                }
              }
              continue;
            }
            const cropDataUrl = await cropDataUrlFromImage_(pageImage.data_url, crop, {
              scale: pageImage.high_resolution ? 1 : 3,
              enhance: true,
              rotation: crop.rotation || 0
            });
            if (!cropDataUrl) continue;
            const ocr = await api('ocrLandRegistryCrop', { dataUrl: cropDataUrl });
            const registry = normalizeRegistryCropReading_(ocr && ocr.registry_number);
            if (registry && ocr && ocr.has_registry_label) {
              fallbackVotes[file.file_id + ':' + pageImage.page_index] = registry;
            }
          }
          return true;
        });
        if (immediateFocusedCandidate) {
          return {
            registry_number: immediateFocusedCandidate.value,
            readings: immediateFocusedCandidate.readings,
            verification_mode: 'PAGE_ANCHORED'
          };
        }
      }
      const focused = chooseFocusedRegistryCandidate_(focusedCandidates, expectedRegistry);
      if (focused) {
        return {
          registry_number: focused.value,
          readings: focused.readings,
          verification_mode: 'PAGE_ANCHORED'
        };
      }
      const readings = Object.keys(fallbackVotes).map(key => fallbackVotes[key]);
      const counts = {};
      readings.forEach(value => { counts[value] = (counts[value] || 0) + 1; });
      const ranked = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
      if (!ranked.length) return { registry_number: '', readings: readings };
      const top = ranked[0];
      const runnerUpCount = ranked.length > 1 ? counts[ranked[1]] : 0;
      if (counts[top] < 2 || counts[top] === runnerUpCount) {
        return { registry_number: '', readings: readings };
      }
      return { registry_number: top, readings: readings };
    }

    function chooseFocusedRegistryCandidate_(candidates, expectedRegistry) {
      const expectedPrefix = (expectedRegistry.match(/^[A-Z]+/) || [''])[0];
      const expectedLength = expectedRegistry.length;
      const filtered = (candidates || []).filter(function(candidate) {
        const value = normalizeRegistryCropReading_(candidate && candidate.value);
        if (!value) return false;
        if (expectedPrefix && value.indexOf(expectedPrefix) !== 0) return false;
        if (expectedLength && value.length !== expectedLength) return false;
        return true;
      });
      if (!filtered.length) return null;
      const counts = {};
      filtered.forEach(function(candidate) {
        counts[candidate.value] = (counts[candidate.value] || 0) + 1;
      });
      const ranked = Object.keys(counts).sort(function(a, b) {
        return counts[b] - counts[a] || b.length - a.length || a.localeCompare(b);
      });
      if (ranked.length > 1 && counts[ranked[0]] === counts[ranked[1]]) return null;
      return filtered.find(candidate => candidate.value === ranked[0]) || null;
    }

    async function suggestRegistryCropForPageImage_(dataUrl) {
      const scaled = await scaleImageForRegistrySuggestion_(dataUrl, 2400);
      if (!scaled || !scaled.data_url) return null;
      const result = await api('suggestLandRegistryCropFromImage', { dataUrl: scaled.data_url });
      const crop = result && result.crop;
      if (!result || !result.ok || !crop) return null;
      return {
        x: Math.round((crop.x || 0) * scaled.scale_x),
        y: Math.round((crop.y || 0) * scaled.scale_y),
        width: Math.round((crop.width || 0) * scaled.scale_x),
        height: Math.round((crop.height || 0) * scaled.scale_y),
        reason: crop.code_box ? 'vision_registry_code_anchor' : (crop.reason || 'vision_registry_crop'),
        anchor_text: crop.anchor_text || '',
        code_box: crop.code_box ? {
          x: Math.round((crop.code_box.x || 0) * scaled.scale_x),
          y: Math.round((crop.code_box.y || 0) * scaled.scale_y),
          width: Math.round((crop.code_box.width || 0) * scaled.scale_x),
          height: Math.round((crop.code_box.height || 0) * scaled.scale_y)
        } : null
      };
    }

    function scaleImageForRegistrySuggestion_(dataUrl, maxDimension) {
      return new Promise(function(resolve) {
        const img = new Image();
        img.onload = function() {
          const originalWidth = img.naturalWidth;
          const originalHeight = img.naturalHeight;
          const scale = Math.min(1, maxDimension / Math.max(originalWidth, originalHeight));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(originalWidth * scale));
          canvas.height = Math.max(1, Math.round(originalHeight * scale));
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve({
            data_url: canvas.toDataURL('image/jpeg', 0.9),
            scale_x: originalWidth / canvas.width,
            scale_y: originalHeight / canvas.height
          });
        };
        img.onerror = function() { resolve(null); };
        img.src = dataUrl;
      });
    }

    function normalizeRegistryCropReading_(value) {
      const registry = cleanValue(value).replace(/\s+/g, '').toUpperCase();
      return /^(?:CS|CT|CN|CH|CL|HX|VP|DC|DL)[-.]?[0-9A-Z.\/-]{2,24}$/i.test(registry)
        ? registry
        : '';
    }

    async function forEachRegistryPageImage_(file, callback) {
      const fileType = String(file && file.file_type || '').toLowerCase();
      const fileName = String(file && file.file_name || '').toLowerCase();
      const isPdf = fileType === 'application/pdf' || /\.pdf$/.test(fileName);
      if (!isPdf) {
        const preview = imageCache[file.file_id] || await api('getCaseImagePreview', { fileId: file.file_id });
        imageCache[file.file_id] = preview;
        if (!preview || !preview.is_image || !preview.data_url) return;
        await callback({
          data_url: preview.data_url,
          page_index: 1,
          high_resolution: false
        });
        return;
      }
      if (!window.pdfjsLib) return;
      const pdfData = await api('getCasePdfData', { fileId: file.file_id });
      const bytes = base64ToUint8Array_(pdfData && pdfData.base64);
      if (!bytes.length) return;
      const pdf = await window.pdfjsLib.getDocument({ data: bytes, disableWorker: true }).promise;
      const pageCount = Math.min(Number(pdf.numPages || 0), 10);
      for (let pageIndex = 1; pageIndex <= pageCount; pageIndex++) {
        const page = await pdf.getPage(pageIndex);
        const baseViewport = page.getViewport({ scale: 1 });
        const scale = Math.min(10, 6600 / Math.max(baseViewport.width, baseViewport.height));
        const viewport = page.getViewport({ scale: scale });
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(viewport.width);
        canvas.height = Math.round(viewport.height);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
        const keepGoing = await callback({
          data_url: canvas.toDataURL('image/jpeg', 0.96),
          page_index: pageIndex,
          high_resolution: true
        });
        canvas.width = 1;
        canvas.height = 1;
        if (keepGoing === false) return;
      }
    }

    function base64ToUint8Array_(value) {
      const binary = atob(String(value || ''));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function buildLandRegistryCropCandidates_(dataUrl, suggestedBox) {
      return new Promise(function(resolve) {
        const img = new Image();
        img.onload = function() {
          const w = img.naturalWidth;
          const h = img.naturalHeight;
          const out = [];
          if (suggestedBox) {
            if (suggestedBox.code_box) {
              out.push(...buildFocusedRegistryCodeBoxes_(suggestedBox.code_box, w, h));
            }
            out.push(suggestedBox);
            out.push(expandCropBox_(suggestedBox, w, h, 0.35, 1.1, 0.35, 0.9));
            out.push(expandCropBox_(suggestedBox, w, h, 0.15, 2.2, 0.55, 1.2));
          }
          out.push({ x: 0, y: Math.round(h * 0.10), width: Math.round(w * 0.18), height: Math.round(h * 0.18), reason: 'land_registry_rotated_left_upper_candidate' });
          out.push({ x: 0, y: Math.round(h * 0.70), width: Math.round(w * 0.18), height: Math.round(h * 0.26), reason: 'land_registry_rotated_left_lower_candidate' });
          out.push({ x: Math.round(w * 0.82), y: Math.round(h * 0.04), width: Math.round(w * 0.18), height: Math.round(h * 0.26), reason: 'land_registry_rotated_right_upper_candidate' });
          out.push({ x: Math.round(w * 0.82), y: Math.round(h * 0.70), width: Math.round(w * 0.18), height: Math.round(h * 0.26), reason: 'land_registry_rotated_right_lower_candidate' });
          out.push({ x: 0, y: Math.round(h * 0.82), width: Math.round(w * 0.42), height: Math.round(h * 0.17), reason: 'land_registry_bottom_left_candidate' });
          out.push({ x: Math.round(w * 0.58), y: Math.round(h * 0.82), width: Math.round(w * 0.42), height: Math.round(h * 0.17), reason: 'land_registry_bottom_right_candidate' });
          out.push({ x: 0, y: Math.round(h * 0.78), width: Math.round(w * 0.62), height: Math.round(h * 0.20), reason: 'land_registry_bottom_left_fallback' });
          out.push({ x: 0, y: Math.round(h * 0.70), width: Math.round(w * 0.78), height: Math.round(h * 0.28), reason: 'land_registry_bottom_wide_fallback' });
          out.push({ x: 0, y: Math.round(h * 0.58), width: Math.round(w * 0.28), height: Math.round(h * 0.40), reason: 'land_registry_left_edge_rotated_fallback' });
          out.push({ x: 0, y: 0, width: Math.round(w * 0.30), height: h, reason: 'land_registry_left_strip_rotated_fallback' });
          out.push({ x: Math.round(w * 0.70), y: 0, width: Math.round(w * 0.30), height: h, reason: 'land_registry_right_strip_rotated_fallback' });
          resolve(out.filter(Boolean));
        };
        img.onerror = function() { resolve(suggestedBox ? [suggestedBox] : []); };
        img.src = dataUrl;
      });
    }

    function buildFocusedRegistryCodeBoxes_(box, pageWidth, pageHeight) {
      const x = Number(box.x || 0);
      const y = Number(box.y || 0);
      const width = Math.max(1, Number(box.width || 0));
      const height = Math.max(1, Number(box.height || 0));
      const boxes = [];
      if (height >= width) {
        [
          { xFactor: 0.82, yFactor: 0.33, widthFactor: 5.95, heightFactor: 2.31, direction: 'forward' },
          { xFactor: 5.13, yFactor: 0.98, widthFactor: 5.95, heightFactor: 2.31, direction: 'reverse' },
          { xFactor: 0.72, yFactor: 0.28, widthFactor: 5.70, heightFactor: 2.20, direction: 'forward_tight' },
          { xFactor: 4.98, yFactor: 0.92, widthFactor: 5.70, heightFactor: 2.20, direction: 'reverse_tight' }
        ].forEach(function(spec) {
          [-90, 90].forEach(function(rotation) {
            boxes.push(clampCropBox_({
              x: x - width * spec.xFactor,
              y: y - height * spec.yFactor,
              width: width * spec.widthFactor,
              height: height * spec.heightFactor,
              rotation: rotation,
              reason: 'vision_registry_vertical_' + spec.direction + '_' + rotation + '_focused'
            }, pageWidth, pageHeight));
          });
        });
      } else {
        boxes.push(clampCropBox_({
          x: x - width * 0.33,
          y: y - height * 0.82,
          width: width * 2.31,
          height: height * 5.95,
          rotation: 0,
          reason: 'vision_registry_horizontal_forward_focused'
        }, pageWidth, pageHeight));
        boxes.push(clampCropBox_({
          x: x - width * 0.98,
          y: y - height * 5.13,
          width: width * 2.31,
          height: height * 5.95,
          rotation: 180,
          reason: 'vision_registry_horizontal_reverse_focused'
        }, pageWidth, pageHeight));
      }
      return boxes.filter(box => box && box.width >= 8 && box.height >= 8);
    }

    function clampCropBox_(box, pageWidth, pageHeight) {
      const x = Math.max(0, Math.round(box.x || 0));
      const y = Math.max(0, Math.round(box.y || 0));
      const right = Math.min(pageWidth, Math.round((box.x || 0) + (box.width || 0)));
      const bottom = Math.min(pageHeight, Math.round((box.y || 0) + (box.height || 0)));
      return {
        x: x,
        y: y,
        width: Math.max(0, right - x),
        height: Math.max(0, bottom - y),
        rotation: Number(box.rotation || 0),
        reason: box.reason || 'registry_code_focused'
      };
    }

    function expandCropBox_(box, pageWidth, pageHeight, leftFactor, rightFactor, topFactor, bottomFactor) {
      const x = Math.max(0, Math.round((box.x || 0) - (box.width || 0) * leftFactor));
      const y = Math.max(0, Math.round((box.y || 0) - (box.height || 0) * topFactor));
      const right = Math.min(pageWidth, Math.round((box.x || 0) + (box.width || 0) * (1 + rightFactor)));
      const bottom = Math.min(pageHeight, Math.round((box.y || 0) + (box.height || 0) * (1 + bottomFactor)));
      return { x: x, y: y, width: Math.max(0, right - x), height: Math.max(0, bottom - y), reason: 'expanded_land_registry_crop' };
    }

    function cropDataUrlFromImage_(dataUrl, box, options) {
      return new Promise(function(resolve) {
        options = options || {};
        const img = new Image();
        img.onload = function() {
          const x = Math.max(0, Math.round(box.x || 0));
          const y = Math.max(0, Math.round(box.y || 0));
          const w = Math.min(img.naturalWidth - x, Math.round(box.width || 0));
          const h = Math.min(img.naturalHeight - y, Math.round(box.height || 0));
          if (w < 8 || h < 8) return resolve('');
          const scale = Math.max(1, Number(options.scale || 1));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(w * scale);
          canvas.height = Math.round(h * scale);
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.drawImage(img, x, y, w, h, 0, 0, canvas.width, canvas.height);
          if (options.colorMode === 'gray') grayscaleOcrCanvas_(ctx, canvas.width, canvas.height);
          else if (options.enhance) enhanceOcrCanvas_(ctx, canvas.width, canvas.height);
          const rotatedCanvas = rotateCanvasForOcr_(canvas, Number(options.rotation || 0));
          resolve(rotatedCanvas.toDataURL('image/png'));
        };
        img.onerror = function() { resolve(''); };
        img.src = dataUrl;
      });
    }

    function rotateCanvasForOcr_(canvas, degrees) {
      const normalized = ((Math.round(degrees / 90) * 90) % 360 + 360) % 360;
      if (!normalized) return canvas;
      const out = document.createElement('canvas');
      if (normalized === 180) {
        out.width = canvas.width;
        out.height = canvas.height;
        const ctx = out.getContext('2d');
        ctx.translate(out.width, out.height);
        ctx.rotate(Math.PI);
        ctx.drawImage(canvas, 0, 0);
        return out;
      }
      out.width = canvas.height;
      out.height = canvas.width;
      const ctx = out.getContext('2d');
      if (normalized === 90) {
        ctx.translate(out.width, 0);
        ctx.rotate(Math.PI / 2);
      } else {
        ctx.translate(0, out.height);
        ctx.rotate(-Math.PI / 2);
      }
      ctx.drawImage(canvas, 0, 0);
      return out;
    }

    function grayscaleOcrCanvas_(ctx, width, height) {
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
        data[i] = gray;
        data[i + 1] = gray;
        data[i + 2] = gray;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function enhanceOcrCanvas_(ctx, width, height) {
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
        const v = Math.max(0, Math.min(255, (gray - 118) * 1.45 + 128));
        data[i] = v;
        data[i + 1] = v;
        data[i + 2] = v;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function autoOrientReviewImage(img) {
      const frame = img.closest('.source-image-frame');
      const degrees = Number(frame && frame.getAttribute('data-ocr-rotation') || 0);
      setReviewImageRotation(img, degrees);
    }

    function rotateReviewImage(frameId, delta) {
      const frame = document.getElementById(frameId);
      const img = frame && frame.querySelector('img');
      if (!img) return;
      const current = Number(img.getAttribute('data-rotation') || 0);
      setReviewImageRotation(img, current + delta);
    }

    function setReviewImageRotation(img, degrees) {
      const normalized = ((degrees % 360) + 360) % 360;
      img.setAttribute('data-rotation', normalized);
      img.classList.remove('rotate-90', 'rotate-180', 'rotate-270');
      if (normalized) img.classList.add('rotate-' + normalized);
    }
    function renderOcr(targetId) {
      const rows = (reviewData.ocr_results || []).map((o, i) => `<tr><td data-label="File">${escapeHtml(o.file_name)}</td><td data-label="Nhóm">${escapeHtml(o.group)}</td><td data-label="Trạng thái">${escapeHtml(o.status)}</td><td data-label="Confidence">${escapeHtml(o.confidence)}</td><td data-label="OCR text"><button class="action" onclick="openOcrPreview(${i})">${o.has_text ? 'Xem OCR' : 'Xem lỗi'}</button></td></tr>`).join('');
      document.getElementById(targetId).innerHTML = `<table><thead><tr><th>File</th><th>Nhóm</th><th>Trạng thái</th><th>Confidence</th><th>OCR text</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    function renderFieldTable(targetId, fields) {
      document.getElementById(targetId).innerHTML = fieldTable(fields);
    }

    function fieldTable(fields) {
      fields = (fields || []).filter(shouldShowField);
      const rows = fields.map(f => {
        const d = displayFieldValues(f);
        return `
        <tr>
          <td data-label="${vi('field')}">${escapeHtml(humanFieldPath(f.path) || f.label)}<small>${escapeHtml(f.path)}</small></td>
          <td data-label="OCR/AI">${escapeHtml(d.ai_value)}</td>
          <td data-label="${vi('manual')}">${escapeHtml(d.manual_value)}</td>
          <td data-label="${vi('final')}"><strong>${escapeHtml(d.final_value)}</strong></td>
          <td data-label="${vi('source')}">${escapeHtml(f.source)}<small>${escapeHtml(f.confidence)}</small></td>
          <td data-label="${vi('action')}">
            <button class="action" onclick="openEdit('${escapeAttr(f.path)}')">${vi('edit')}</button>
          </td>
        </tr>`;
      }).join('');
      if (!rows) return '<div class="loading">' + vi('none') + '</div>'; 
      return `<table><thead><tr><th>${vi('field')}</th><th>OCR/AI</th><th>${vi('manual')}</th><th>${vi('final')}</th><th>${vi('source')}</th><th>${vi('action')}</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    function displayFieldValues(field) {
      const out = Object.assign({}, field || {});
      const owner = getOwnerDerivedDisplay(field && field.path);
      if (owner) {
        out.ai_value = owner;
        if (!out.manual_value) out.final_value = owner;
      }
      return out;
    }

    function getOwnerDerivedDisplay(path) {
      const m = String(path || '').match(/^assets\[(\d+)\]\.(owner_name|owner_id_document_type|owner_id_number)$/);
      if (!m) return '';
      const asset = (reviewData.assets || [])[Number(m[1])] || {};
      const parts = parseOwnerIdentitySummary(valueOf(asset.owner_identity_summary));
      if (!parts.length) return '';
      if (m[2] === 'owner_name') return parts.map(p => p.name).filter(Boolean).join('; ');
      if (m[2] === 'owner_id_document_type') return parts.map(p => p.docType).filter(Boolean).join('; ');
      if (m[2] === 'owner_id_number') return parts.map(p => p.id).filter(Boolean).join('; ');
      return '';
    }

    function parseOwnerIdentitySummary(value) {
      return String(value || '').split(';').map(item => {
        const text = item.trim();
        if (!text) return null;
        const exact = text.match(/^(.*?),\s*([^,:]+)\s*:\s*(\d{12}|\d{9})\s*$/);
        if (exact) {
          return {
            name: exact[1].replace(/^(?:\u00d4ng|B\u00e0|V\u00e0\s+v\u1ee3|V\u1ee3|Ch\u1ed3ng)\s*:\s*/i, '').trim(),
            docType: exact[2].trim(),
            id: exact[3]
          };
        }
        const idMatch = text.match(/(\d{12}|\d{9})/);
        const id = idMatch ? idMatch[1] : '';
        let beforeId = id ? text.slice(0, text.indexOf(id)).trim() : text;
        beforeId = beforeId.replace(/[,:-]+\s*$/g, '').trim();
        const parts = beforeId.split(/\s+-\s+/);
        const name = (parts[0] || '').trim();
        const docType = (parts.slice(1).join(' - ') || beforeId.replace(name, '') || '').replace(/\bso\b$/i, '').trim();
        return { name, docType, id };
      }).filter(Boolean);
    }

    function shouldShowField(field) {
      if (!field || isHiddenReviewPath(field.path)) return false;
      if (isAlwaysVisibleReviewPath(field.path)) return true;
      return Boolean(cleanValue(field.ai_value) || cleanValue(field.form_value) || cleanValue(field.manual_value) || cleanValue(field.final_value));
    }

    function isAlwaysVisibleReviewPath(path) {
      return [
        /^(secured_parties|obligors)\[\d+\]\.id_issue_date$/,
        /^(secured_parties|obligors)\[\d+\]\.id_issue_place$/,
        /^assets\[\d+\]\.real_estate\.registry_number$/
      ].some(re => re.test(String(path || '')));
    }

    function cleanValue(value) {
      return fixCommonMojibake(String(value == null ? '' : value).trim());
    }

    function fixCommonMojibake(value) {
      return String(value || '')
        .replace(/KhÃ´ng rÃµ, Ä‘á» nghá»‹ sá»­a thá»§ cÃ´ng/g, 'Kh\u00f4ng r\u00f5, \u0111\u1ec1 ngh\u1ecb s\u1eeda th\u1ee7 c\u00f4ng')
        .replace(/KhÃ´ng cÃ³/g, 'Kh\u00f4ng c\u00f3')
        .replace(/KhÃ´ng Ä‘á»c rÃµ/g, 'Kh\u00f4ng \u0111\u1ecdc r\u00f5');
    }

    function flattenFields(obj, path) {
      const out = [];
      walk(obj, path, out);
      return out;
    }

    function walk(obj, path, out) {
      if (!obj || typeof obj !== 'object') return;
      if (Object.prototype.hasOwnProperty.call(obj, 'final_value')) {
        out.push(Object.assign({ path }, obj));
        return;
      }
      Object.keys(obj).forEach(k => {
        if (k === 'roles') return;
        const nextPath = path ? `${path}.${k}` : k;
        if (isHiddenReviewPath(nextPath)) return;
        walk(obj[k], nextPath, out);
      });
    }

    function isHiddenReviewPath(path) {
      return [
        '.spouse',
        '.marriage_registration',
        '.marital_status_certificate',
        '.marital_status',
        '.current_address_final',
        '.real_estate.owner_or_user',
        '.real_estate.owner_address',
        '.real_estate.certificate_info_raw_text',
        '.real_estate.certificate_owner_raw_text',
        '.real_estate.certificate_land_raw_text',
        '.real_estate.certificate_attached_raw_text'
      ].some(part => String(path || '').indexOf(part) >= 0);
    }

    function getField(path) {
      return path.split('.').reduce((acc, part) => {
        if (!acc) return null;
        const m = part.match(/^(.+)\[(\d+)\]$/);
        return m ? (acc[m[1]] || [])[Number(m[2])] : acc[part];
      }, reviewData);
    }

    function openEdit(path) {
      currentEditPath = path;
      const field = getField(path);
      document.getElementById('editTitle').textContent = vi('edit') + ': ' + (humanFieldPath(path) || field.label || path);
      document.getElementById('editValue').value = field.final_value || '';
      document.getElementById('editReason').value = '';
      document.getElementById('editDialog').showModal();
    }

    async function openOcrPreview(index) {
      const item = (reviewData.ocr_results || [])[index] || {};
      document.getElementById('ocrTitle').textContent = item.file_name || 'OCR text';
      document.getElementById('ocrText').value = 'Đang tải OCR text...';
      document.getElementById('ocrDialog').showModal();
      try {
        const result = await api('getCaseOcrText', { fileId: item.file_id || '', fileName: item.file_name || '' });
        document.getElementById('ocrText').value = (result && result.text) || item.text_preview || 'Không có OCR text trong dữ liệu Review.';
      } catch (err) {
        document.getElementById('ocrText').value = (item.text_preview || '') + '\n\n[Lỗi tải OCR đầy đủ] ' + err.message;
      }
    }

    async function saveEdit() {
      try {
        const path = currentEditPath;
        const newValue = document.getElementById('editValue').value;
        const reason = document.getElementById('editReason').value;
        const scrollX = window.scrollX;
        const scrollY = window.scrollY;
        applyManualOverrideLocally(path, newValue);
        document.getElementById('editDialog').close();
        render();
        window.scrollTo(scrollX, scrollY);
        api('saveOverride', {
          fieldPath: path,
          newValue: newValue,
          reason: reason
        }).catch(err => {
          alert('Luu sua doi len he thong khong thanh cong: ' + err.message);
          reloadData();
        });
      } catch (err) {
        alert(err.message);
        reloadData();
      }
    }

    function applyManualOverrideLocally(path, newValue) {
      const field = getField(path);
      if (!field || typeof field !== 'object') return;
      field.manual_value = newValue;
      field.final_value = newValue;
      field.source = 'MANUAL';
      field.confirmed = true;
    }

    function renderContractDraftField(f) {
      const value = f.inferred ? f.inferred() : getReviewFieldFinalValue(f.path);

        f.affectsVisibility ? 'updateDraftConditionalFields()' : '',
        f.onChange || ''
      ].filter(Boolean).join('; ');

        (f.dependsOn ? ' data-draft-depends-on="' + escapeAttr(f.dependsOn) + '" data-draft-show-when="' + escapeAttr(f.showWhen || '') + '"' : '') +
        (events ? ' onchange="' + escapeAttr(events) + '"' : '') +
        (f.type === 'money' ? ' inputmode="numeric" oninput="formatMoneyInput(this); updateMoneyFields()"' : '') +
        (f.readonly ? ' readonly' : '') +
        (f.disabled ? ' disabled' : '');
      const wrapperAttrs = f.dependsOn ? ' data-draft-field-wrapper data-depends-on="' + escapeAttr(f.dependsOn) + '" data-show-when="' + escapeAttr(f.showWhen || '') + '"' : ' data-draft-field-wrapper';
      if (f.type === 'select') {
        const opts = (f.options || []).map(option => '<option value="' + escapeAttr(option) + '"' + (normalizePlainText(option) === normalizePlainText(value) ? ' selected' : '') + '>' + escapeHtml(option || '-- Ch\u1ecdn --') + '</option>').join('');
        return '<div class="draft-field"' + wrapperAttrs + '><label>' + escapeHtml(f.label) + '</label><select' + attrs + '>' + opts + '</select></div>';
      }
      if (f.type === 'textarea') {
        return '<div class="draft-field"' + wrapperAttrs + '><label>' + escapeHtml(f.label) + '</label><textarea' + attrs + '>' + escapeHtml(value) + '</textarea></div>';
      }
      return '<div class="draft-field"' + wrapperAttrs + '><label>' + escapeHtml(f.label) + '</label><input' + attrs + ' value="' + escapeAttr(value) + '" placeholder="' + escapeAttr(f.placeholder || '') + '"></div>';
    }
    function getReviewFieldFinalValue(path) {
      const field = getByPathClient(reviewData, path);
      if (field && typeof field === 'object' && Object.prototype.hasOwnProperty.call(field, 'final_value')) return field.final_value || '';
      return '';
    }

    function inferAssetTypeForDraft() {
      const current = getReviewFieldFinalValue('contract_info.asset_type');
      if (current) {
        const norm = normalizePlainText(current);
        if (norm.indexOf('real estate') >= 0 || norm.indexOf('bat dong san') >= 0) return 'B\u1ea5t \u0111\u1ed9ng s\u1ea3n';
        if (norm.indexOf('movable') >= 0 || norm.indexOf('dong san') >= 0) return '\u0110\u1ed9ng s\u1ea3n';
        return current;
      }
      const first = (reviewData.assets || [])[0] || {};
      const raw = getFieldValueClient(first.asset_type) ||
        getFieldValueClient(first.real_estate && first.real_estate.certificate_number) ||
        getFieldValueClient(first.movable && first.movable.registration_number);
      const norm = normalizePlainText(raw);
      if (norm.indexOf('movable') >= 0 || norm.indexOf('dong san') >= 0) return '\u0110\u1ed9ng s\u1ea3n';
      return 'B\u1ea5t \u0111\u1ed9ng s\u1ea3n';
    }

    function getByPathClient(root, path) {

    function groupContractTemplates(templates) {
      const groups = [
        { key: 'bds', label: 'Hop dong the chap bat dong san', templates: [] },
        { key: 'dong_san', label: 'Hop dong the chap dong san', templates: [] },
        { key: 'khac', label: 'Bieu mau khac', templates: [] }
      ];
      templates.forEach(tpl => {
        const text = normalizePlainText((tpl.asset_type || '') + ' ' + (tpl.code || '') + ' ' + (tpl.name || ''));
        if (text.indexOf('bat dong san') >= 0 || text.indexOf('bds') >= 0) groups[0].templates.push(tpl);
        else if (text.indexOf('dong san') >= 0) groups[1].templates.push(tpl);
        else groups[2].templates.push(tpl);
      });
      return groups.filter(group => group.templates.length);
    }

      const resultEl = document.getElementById('generatedResult');
      const btn = document.getElementById('generateContractsButton');
      const codes = Array.from(document.querySelectorAll('.contract-template-choice:checked')).map(input => input.value);
      if (!codes.length) {
        alert('Vui long chon it nhat mot mau da duoc cau hinh.');
        return;
      }
      generateBusy = true;
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Dang xuat file...';
      }
      resultEl.textContent = 'Dang soan thao va xuat file. Vui long khong bam lai trong luc he thong xu ly...';
      try {
        const draftValues = collectContractDraftInfoValues();
        if (Object.keys(draftValues).length) {
          reviewData = await api('saveContractDraftInfo', { values: draftValues });
        }
        const result = await api('generateContracts', { templateCodes: codes });
        resultEl.innerHTML = renderGeneratedContractsResult(result);
        autoDownloadGeneratedDocs(result);
      } catch (err) {
        resultEl.textContent = err.message;
      } finally {
        generateBusy = false;
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Xuat mau da chon';
        }
      }
    }

    function collectContractDraftInfoValues() {
      const values = {};
      document.querySelectorAll('[data-draft-path]').forEach(input => {
        const path = input.getAttribute('data-draft-path');
        values[path] = input.classList.contains('money-input') ? unformatMoney(input.value) : (input.value || '');
      });
      values['contract_info.asset_type'] = inferAssetTypeForDraft();
      values['contract_info.contract_type'] = inferContractTypeForDraft();
      values['contract_info.bank_signer_title'] = (document.querySelector('[data-draft-path="contract_info.bank_signer_title"]') || {}).value || inferBankSignerTitleForDraft();
      values['contract_info.bank_unit_address'] = (document.querySelector('[data-draft-path="contract_info.bank_unit_address"]') || {}).value || inferBankSignerAddressForDraft();
      const total = calculateMoneyTotal();
      values['contract_info.valuation_total_amount'] = total ? String(total) : '';
      values['contract_info.valuation_amount'] = total ? String(total) : '';
      if (normalizePlainText(values['contract_info.actual_asset_differs_from_certificate']) !== 'co') {
        values['contract_info.actual_asset_difference_description'] = '';
        values['contract_info.actual_house_asset'] = '';
      } else if (!values['contract_info.actual_house_asset']) {
        values['contract_info.actual_house_asset'] = values['contract_info.actual_asset_difference_description'] || '';
      }
      return values;
    }

    function formatMoneyInput(input) {
      const digits = unformatMoney(input.value);
      input.value = formatMoney(digits);
    }

    function updateMoneyFields() {
      document.querySelectorAll('[data-draft-path="contract_info.valuation_land_amount"], [data-draft-path="contract_info.valuation_house_amount"], [data-draft-path="contract_info.valuation_total_amount"]').forEach(input => {
        input.classList.add('money-input');
        if (input.value) input.value = formatMoney(unformatMoney(input.value));
      });
      const totalInput = document.querySelector('[data-draft-path="contract_info.valuation_total_amount"]');
      if (totalInput) totalInput.value = formatMoney(calculateMoneyTotal());
    }

    function calculateMoneyTotal() {
      const land = Number(unformatMoney((document.querySelector('[data-draft-path="contract_info.valuation_land_amount"]') || {}).value || '')) || 0;
      const house = Number(unformatMoney((document.querySelector('[data-draft-path="contract_info.valuation_house_amount"]') || {}).value || '')) || 0;
      return land + house;
    }

    function unformatMoney(value) {
      return String(value || '').replace(/[^\d]/g, '');
    }

    function formatMoney(value) {
      const digits = String(value || '').replace(/[^\d]/g, '');
      return digits ? digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
    }

    function updateDraftConditionalFields() {
      document.querySelectorAll('[data-draft-field-wrapper][data-depends-on]').forEach(wrapper => {
        const dependsOn = wrapper.getAttribute('data-depends-on');
        const showWhen = wrapper.getAttribute('data-show-when') || '';
        const controller = document.querySelector('[data-draft-path="' + cssEscape(dependsOn) + '"]');
        const shouldShow = controller && normalizePlainText(controller.value) === normalizePlainText(showWhen);
        wrapper.style.display = shouldShow ? '' : 'none';
        if (!shouldShow) {
          wrapper.querySelectorAll('[data-draft-path]').forEach(input => { input.value = ''; });
        }
      });
    }

    function cssEscape(value) {
      if (window.CSS && CSS.escape) return CSS.escape(value);
      return String(value || '').replace(/"/g, '\\"');
    }

    function renderGeneratedContractsResult(result) {
      const parts = ['<div><strong>Da xu ly xong.</strong></div>'];
      if (result.email_sent_to) parts.push('<div>Da gui email toi: ' + escapeHtml(result.email_sent_to) + '</div>');
      (result.generated || []).forEach(item => {
        const status = item.status === 'DONE' ? 'Thanh cong' : 'Loi';
        let actions = '';
        if (item.docx_download_url || item.docx_url) {
          const url = item.docx_download_url || item.docx_url;
          actions = '<div class="generated-actions"><a class="download-link" download target="_blank" href="' + escapeAttr(url) + '">Tai DOCX</a></div>';
        }
        parts.push('<div class="generated-item"><strong>' + escapeHtml(item.template_name || item.template_code || '') + ': ' + escapeHtml(status) + '</strong>' +
          (item.error ? '<div>' + escapeHtml(item.error) + '</div>' : '') + actions + '</div>');
      });
      return parts.join('');
    }

    function autoDownloadGeneratedDocs(result) {
      const done = (result.generated || []).filter(item => item.status === 'DONE' && (item.docx_download_url || item.docx_url));
      if (!done.length) return;
      done.forEach((item, index) => {
        const a = document.createElement('a');
        a.href = item.docx_download_url || item.docx_url;
        a.download = '';
        a.target = '_blank';
        a.style.display = 'none';
        document.body.appendChild(a);
        setTimeout(function() {
        a.click();
        document.body.removeChild(a);
        }, 300 + index * 700);
      });
    }

    function normalizePlainText(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd')
        .replace(/Đ/g, 'D')
        .toLowerCase();
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    }
    function escapeAttr(value) { return escapeHtml(value).replace(/`/g, '&#96;'); }
    reloadData();
  </script>
</body>
</html>
